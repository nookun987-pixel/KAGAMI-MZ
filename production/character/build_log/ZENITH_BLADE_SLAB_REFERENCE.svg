<svg viewBox="0 0 940 800" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="940" height="800" fill="#050508"/>
  <text x="470" y="52" fill="#F2EEEA" font-size="26" text-anchor="middle" letter-spacing="3">ZENITH BLADE — SLAB STRUCTURE LOCK</text>
  <text x="470" y="78" fill="#8F00FF" font-size="12" text-anchor="middle" letter-spacing="4">FIXED DESIGN · GEOMETRY IS CANON, NOT A GRADE ISSUE</text>

  <!-- divider -->
  <line x1="470" y1="110" x2="470" y2="760" stroke="#2a2a30" stroke-width="1"/>

  <!-- ================= WRONG ================= -->
  <text x="235" y="132" fill="#E03131" font-size="16" text-anchor="middle" letter-spacing="3">WRONG — what shipped</text>
  <!-- thin tapered blade -->
  <g>
    <!-- grip -->
    <rect x="228" y="160" width="14" height="34" fill="#3a3a42" stroke="#8695A2" stroke-width="1"/>
    <ellipse cx="235" cy="210" rx="26" ry="7" fill="none" stroke="#8695A2" stroke-width="1.5"/>
    <!-- narrow tapering blade -->
    <polygon points="223,200 247,200 240,560 235,600 230,560" fill="#111418" stroke="#8695A2" stroke-width="1.2"/>
    <line x1="235" y1="205" x2="235" y2="592" stroke="#8F00FF" stroke-width="2"/>
  </g>
  <text x="235" y="640" fill="#E03131" font-size="12" text-anchor="middle">narrow width · tapers to a needle</text>
  <text x="235" y="660" fill="#E03131" font-size="12" text-anchor="middle">reads as katana / greatsword</text>
  <!-- big X -->
  <line x1="150" y1="180" x2="320" y2="610" stroke="#E03131" stroke-width="4" opacity="0.55"/>
  <line x1="320" y1="180" x2="150" y2="610" stroke="#E03131" stroke-width="4" opacity="0.55"/>

  <!-- ================= RIGHT ================= -->
  <text x="705" y="132" fill="#8F00FF" font-size="16" text-anchor="middle" letter-spacing="3">RIGHT — canon slab</text>
  <g>
    <!-- short grip -->
    <rect x="697" y="158" width="16" height="30" fill="#3a3a42" stroke="#C39A52" stroke-width="1"/>
    <!-- broad rectangular slab: parallel edges, wide -->
    <rect x="640" y="188" width="130" height="352" fill="#14171b" stroke="#F2EEEA" stroke-width="1.6"/>
    <!-- short chisel tip only at the end (~13%) -->
    <polygon points="640,540 770,540 715,606 705,606" fill="#14171b" stroke="#F2EEEA" stroke-width="1.6"/>
    <!-- single violet core seam dead-center full length -->
    <line x1="705" y1="192" x2="705" y2="600" stroke="#8F00FF" stroke-width="3"/>
    <!-- grip ring at mid-shaft -->
    <ellipse cx="705" cy="360" rx="34" ry="12" fill="none" stroke="#D6D6D6" stroke-width="3"/>
  </g>

  <!-- callouts -->
  <g fill="#C8AD87" font-size="11.5" font-family="monospace">
    <line x1="770" y1="230" x2="852" y2="215" stroke="#4B5866" stroke-width="1"/>
    <text x="856" y="212">WIDTH ≈ 0.22–0.26 × LENGTH</text>
    <text x="856" y="228">broad · parallel long edges</text>

    <line x1="770" y1="365" x2="852" y2="360" stroke="#4B5866" stroke-width="1"/>
    <text x="856" y="357">grip ring at MID-SHAFT</text>

    <line x1="708" y1="380" x2="600" y2="430" stroke="#4B5866" stroke-width="1"/>
    <text x="360" y="434">single VIOLET core seam,</text>
    <text x="360" y="450">dead-center, full length</text>

    <line x1="720" y1="575" x2="820" y2="600" stroke="#4B5866" stroke-width="1"/>
    <text x="824" y="597">chisel tip: last ~13% ONLY</text>
    <text x="824" y="613">blunt, NOT a needle</text>
  </g>
  <text x="705" y="660" fill="#F2EEEA" font-size="12" text-anchor="middle">heavy flat plate · POINT DOWN</text>

  <!-- ban strip -->
  <rect x="70" y="700" width="800" height="60" fill="none" stroke="#E03131" stroke-width="1"/>
  <text x="84" y="722" fill="#E03131" font-size="12" letter-spacing="2">BANS:</text>
  <text x="150" y="722" fill="#F2EEEA" font-size="12">needle taper · katana curve · longsword profile · crossguard · narrow blade · double-edge taper along whole length</text>
  <text x="84" y="744" fill="#8695A2" font-size="11">Fix path: RE-MODEL the blade mesh to these proportions (Codex/Blender). Regrade/relight cannot fix geometry. Re-shoot all 3 cards after.</text>
</svg>
