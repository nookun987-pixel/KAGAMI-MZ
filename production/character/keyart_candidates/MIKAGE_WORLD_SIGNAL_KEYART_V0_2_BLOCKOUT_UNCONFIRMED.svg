<svg viewBox="0 0 1080 1620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" font-family="'Space Mono','DejaVu Sans Mono',monospace">
  <title id="ttl">Mikage — World Signal Key Art, V0.2 composition blockout</title>
  <desc id="desc">Flat-shape proportion blockout, mid-thigh-up crop. Mikage central and enlarged as the only real material, Lyra-0 and Dr. Aris as translucent signal ghosts left and right, a single cold-white halo behind the helmet, a low anonymous skyline, no hero mount, one thin violet trace from the left ghost through Mikage to the sensor slit. UNCONFIRMED — proportion test only.</desc>

  <defs>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2eeea" stop-opacity="0.36"/>
      <stop offset="45%" stop-color="#dcd8e6" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#f2eeea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="porc2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9e4dd"/>
      <stop offset="100%" stop-color="#a4a099"/>
    </linearGradient>
    <linearGradient id="coat2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcb7af"/>
      <stop offset="100%" stop-color="#67645f"/>
    </linearGradient>
    <linearGradient id="vio2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8F00FF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#8F00FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8F00FF" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="grain2"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer><feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <!-- L1 VOID -->
  <rect x="0" y="0" width="1080" height="1620" fill="#050508"/>

  <!-- proportion guides -->
  <g stroke="#8F00FF" stroke-opacity="0.16" stroke-width="1">
    <line x1="540" y1="0" x2="540" y2="1620" stroke-dasharray="2 8"/>
    <line x1="360" y1="0" x2="360" y2="1620" stroke-dasharray="2 12" stroke-opacity="0.09"/>
    <line x1="720" y1="0" x2="720" y2="1620" stroke-dasharray="2 12" stroke-opacity="0.09"/>
    <line x1="0" y1="540" x2="1080" y2="540" stroke-dasharray="2 12" stroke-opacity="0.09"/>
    <line x1="0" y1="1080" x2="1080" y2="1080" stroke-dasharray="2 12" stroke-opacity="0.09"/>
  </g>

  <!-- L1 SKYLINE (low anonymous horizon) -->
  <g fill="#0b0b14">
    <rect x="0" y="1150" width="1080" height="90"/>
    <rect x="60" y="1060" width="64" height="180"/>
    <rect x="140" y="1100" width="40" height="140"/>
    <rect x="196" y="1030" width="52" height="210"/>
    <rect x="840" y="1050" width="56" height="190"/>
    <rect x="908" y="1095" width="42" height="145"/>
    <rect x="960" y="1010" width="58" height="230"/>
  </g>
  <rect x="0" y="1150" width="1080" height="90" fill="#050508" opacity="0.4"/>

  <!-- L5 HALO (single light source, cold white) -->
  <ellipse cx="540" cy="360" rx="330" ry="360" fill="url(#halo2)"/>

  <!-- L3 GHOST  Lyra-0 (left) -->
  <g opacity="0.24" fill="url(#porc2)">
    <circle cx="288" cy="500" r="62"/>
    <path d="M288 562 q-104 18 -116 208 l-44 852 l320 0 l-44 -852 q-12 -190 -116 -208 z"/>
  </g>
  <!-- L3 GHOST  Dr. Aris (right) -->
  <g opacity="0.22" fill="url(#porc2)">
    <circle cx="800" cy="532" r="58"/>
    <path d="M800 590 q-98 16 -110 196 l-40 834 l300 0 l-40 -834 q-12 -180 -110 -196 z"/>
  </g>

  <!-- L4 MIKAGE — only real material, tallest, center, mid-thigh up -->
  <g>
    <!-- coat / body to frame bottom (cropped at mid-thigh) -->
    <path d="M540 452 q-188 18 -224 226 l-78 942 l604 0 l-78 -942 q-36 -208 -224 -226 z" fill="url(#coat2)" stroke="#26242a" stroke-width="2"/>
    <!-- coat opening hairline -->
    <line x1="540" y1="540" x2="540" y2="1610" stroke="#050508" stroke-width="3.5" opacity="0.55"/>
    <!-- shoulders accent -->
    <path d="M352 700 q188 -78 376 0" stroke="#cfcbc4" stroke-width="2" fill="none" opacity="0.38"/>
    <!-- neck -->
    <path d="M506 446 l-7 62 l82 0 l-7 -62 z" fill="#0d0d14"/>
    <!-- HELMET (faceless porcelain, enlarged) -->
    <path d="M415 360 q-8 -150 125 -165 q133 15 125 165 q14 120 -22 196 q-38 80 -103 88 q-65 -8 -103 -88 q-36 -76 -22 -196 z" fill="url(#porc2)" stroke="#3a3840" stroke-width="2.2"/>
    <path d="M484 312 q56 -24 112 0" stroke="#f2eeea" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- exactly two sensor slits -->
    <rect x="462" y="380" width="64" height="7" rx="3.5" fill="#050508"/>
    <rect x="554" y="380" width="64" height="7" rx="3.5" fill="#050508"/>
    <rect x="462" y="380" width="64" height="7" rx="3.5" fill="#8F00FF" opacity="0.10"/>
    <rect x="554" y="380" width="64" height="7" rx="3.5" fill="#8F00FF" opacity="0.10"/>
  </g>

  <!-- L6 VIOLET TRACE — one hairline: left ghost -> Mikage -> sensor slit -->
  <g fill="none">
    <circle cx="288" cy="640" r="5" fill="#8F00FF" opacity="0.8"/>
    <path d="M288 640 C 372 840, 470 690, 540 392" stroke="url(#vio2)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="540" cy="392" r="3.4" fill="#f2eeea"/>
  </g>

  <!-- L7 GRAIN -->
  <rect x="0" y="0" width="1080" height="1620" filter="url(#grain2)" opacity="0.5"/>

  <!-- ===== ANNOTATION LEGEND ===== -->
  <g letter-spacing="1">
    <text x="44" y="70" fill="#f2eeea" font-size="26" letter-spacing="3">MIKAGE — WORLD SIGNAL  ·  V0.2 BLOCKOUT</text>
    <text x="44" y="100" fill="#7B2FFF" font-size="20">UNCONFIRMED · mid-thigh crop · hero mount REMOVED · 2:3</text>
  </g>
  <g font-size="17" fill="#9a968f" letter-spacing="1" text-anchor="end">
    <text x="1036" y="360">halo — SOLE light</text>
    <text x="1036" y="385" fill="#6f6c66">cold white only</text>
  </g>
  <g font-size="16" fill="#7a766f" letter-spacing="1">
    <text x="150" y="440">Lyra-0 ghost ~24%</text>
    <text x="720" y="470">Dr.Aris ghost ~22%</text>
    <text x="44" y="1320">skyline — anonymous, low horizon</text>
    <text x="566" y="408" fill="#8F00FF" fill-opacity="0.9">violet ends at slit</text>
  </g>
</svg>
