<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikage Zenith — Website Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--void);color:var(--porcelain)}
  *{box-sizing:border-box}
  a{color:inherit}
  ::selection{background:rgba(143,0,255,0.4);color:var(--porcelain)}
  .mz-trace{stroke-dasharray:1400;stroke-dashoffset:1400;animation:mzdraw 3s var(--ease) forwards}
  @keyframes mzdraw{to{stroke-dashoffset:0}}
  .mz-float{animation:mzfloat 7s ease-in-out infinite}
  @keyframes mzfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:var(--void)}
  ::-webkit-scrollbar-thumb{background:var(--void-line)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
</body>
</html>
