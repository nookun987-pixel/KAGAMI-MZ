<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--void);padding:30px 32px;box-sizing:border-box;min-height:340px}
  .hd{font-family:var(--font-mono);font-size:10px;letter-spacing:0.34em;text-transform:uppercase;color:var(--silver-dim);margin-bottom:22px}
  .line{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--hairline);padding:12px 0}
  .tk{font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;color:var(--silver-dim);width:96px;flex:none}
  .sp{font-family:var(--font-serif);color:var(--porcelain);letter-spacing:0.12em;line-height:1}
</style>
</head>
<body>
  <div class="hd">Headline voice — Shippori Mincho</div>
  <div class="line"><span class="tk">H1 · 80 / 700</span><span class="sp" style="font-size:52px;font-weight:700">A white shell rises</span></div>
  <div class="line"><span class="tk">H2 · 52 / 600</span><span class="sp" style="font-size:38px;font-weight:600">Fifth transmission</span></div>
  <div class="line"><span class="tk">H3 · 33 / 600</span><span class="sp" style="font-size:28px;font-weight:600">Porcelain Ascension</span></div>
  <div class="line"><span class="tk">Lead · 20 / 400</span><span class="sp" style="font-size:20px;font-weight:400;letter-spacing:0.02em;color:var(--porcelain-dim)">Listen now. The rest remain in the archive.</span></div>
</body>
</html>
