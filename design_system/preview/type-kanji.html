<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--void);padding:30px 32px;box-sizing:border-box;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .hd{font-family:var(--font-mono);font-size:10px;letter-spacing:0.34em;text-transform:uppercase;color:var(--silver-dim)}
  .kanji{font-family:var(--font-serif);font-weight:700;font-size:56px;letter-spacing:0.3em;color:var(--porcelain);text-indent:0.3em}
  .gloss{font-family:var(--font-serif);font-size:15px;letter-spacing:0.4em;text-transform:uppercase;color:var(--silver)}
  .note{font-family:var(--font-serif);font-size:13px;color:var(--porcelain-dim);max-width:520px;line-height:1.6}
</style>
</head>
<body>
  <div class="hd">CJK &amp; meaning — Shippori Mincho</div>
  <div class="kanji">鏡 · 镜 · 거울</div>
  <div class="gloss">Mikage — the mirror · the sealed one</div>
  <div class="note">Releases ship across English, Japanese, Chinese, Korean &amp; Vietnamese. The serif carries full CJK so titles never break canon.</div>
</body>
</html>
