<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--void);font-family:var(--font-mono);padding:26px;box-sizing:border-box;min-height:230px}
  .hd{font-size:10px;letter-spacing:0.34em;text-transform:uppercase;color:var(--silver-dim);margin-bottom:6px}
  .sub{font-family:var(--font-serif);font-size:13px;color:var(--porcelain-dim);margin-bottom:18px}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .sw{display:flex;flex-direction:column;gap:9px}
  .chip{height:48px;display:flex;align-items:center;padding-left:12px;border:1px solid var(--hairline)}
  .dot{width:9px;height:9px;border-radius:50%}
  .nm{font-size:11px;letter-spacing:0.08em;color:var(--porcelain)}
  .st{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--silver-dim)}
</style>
</head>
<body>
  <div class="hd">Signal status — proof / canon console states</div>
  <div class="sub">Status reads as light intensity, not festive color. No green ✓, no red ✗.</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--void-mid)"><span class="dot" style="background:#9d7fd0;box-shadow:0 0 10px #9d7fd0"></span></div><span class="nm">live</span><span class="st">#9D7FD0 · confirmed</span></div>
    <div class="sw"><div class="chip" style="background:var(--void-mid)"><span class="dot" style="background:#c2a85a"></span></div><span class="nm">pending</span><span class="st">#C2A85A · review</span></div>
    <div class="sw"><div class="chip" style="background:var(--void-mid)"><span class="dot" style="background:#c8536b"></span></div><span class="nm">fail</span><span class="st">#C8536B · rejected</span></div>
    <div class="sw"><div class="chip" style="background:var(--void-mid)"><span class="dot" style="background:#6b6b78"></span></div><span class="nm">unconfirmed</span><span class="st">#6B6B78 · void</span></div>
  </div>
</body>
</html>
