<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--void);padding:30px 32px;box-sizing:border-box;min-height:260px}
  .hd{font-family:var(--font-mono);font-size:10px;letter-spacing:0.34em;text-transform:uppercase;color:var(--silver-dim);margin-bottom:20px}
  .wm{font-family:var(--font-wordmark);font-weight:600;font-size:46px;letter-spacing:0.42em;text-indent:0.42em;color:var(--porcelain);line-height:1.1}
  .specs{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--silver-dim);margin-top:22px;display:flex;gap:26px;flex-wrap:wrap}
  .specs b{color:var(--porcelain);font-weight:400}
  .glyphs{font-family:var(--font-wordmark);font-weight:500;font-size:20px;letter-spacing:0.2em;color:var(--silver);margin-top:14px}
</style>
</head>
<body>
  <div class="hd">Wordmark voice — Cinzel</div>
  <div class="wm">MIKAGE</div>
  <div class="glyphs">ZENITH · A B C D E F G H I J K · 0 1 2 3</div>
  <div class="specs"><span><b>Cinzel</b> · engraved roman serif</span><span>weight <b>600</b></span><span>tracking <b>0.42em</b></span><span>uppercase only</span></div>
</body>
</html>
