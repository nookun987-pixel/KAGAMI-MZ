<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--void);font-family:var(--font-mono);padding:26px;box-sizing:border-box;min-height:240px}
  .hd{font-size:10px;letter-spacing:0.34em;text-transform:uppercase;color:var(--silver-dim);margin-bottom:18px}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .sw{display:flex;flex-direction:column;gap:8px}
  .chip{height:74px;border:1px solid var(--hairline)}
  .nm{font-size:11px;letter-spacing:0.1em;color:var(--porcelain)}
  .hex{font-size:10px;letter-spacing:0.06em;color:var(--silver-dim)}
  .use{font-size:9px;letter-spacing:0.04em;color:var(--silver-dim)}
</style>
</head>
<body>
  <div class="hd">Void — backgrounds &amp; ascending elevation</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#050508"></div><span class="nm">void</span><span class="hex">#050508</span><span class="use">primary canvas</span></div>
    <div class="sw"><div class="chip" style="background:#0d0d14"></div><span class="nm">void-mid</span><span class="hex">#0D0D14</span><span class="use">raised panel</span></div>
    <div class="sw"><div class="chip" style="background:#1a1a28"></div><span class="nm">void-light</span><span class="hex">#1A1A28</span><span class="use">card surface</span></div>
    <div class="sw"><div class="chip" style="background:#242436"></div><span class="nm">void-line</span><span class="hex">#242436</span><span class="use">divider</span></div>
  </div>
</body>
</html>
