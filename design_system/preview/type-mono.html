<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--void);padding:30px 32px;box-sizing:border-box;min-height:300px}
  .hd{font-family:var(--font-mono);font-size:10px;letter-spacing:0.34em;text-transform:uppercase;color:var(--silver-dim);margin-bottom:22px}
  .row{display:flex;flex-direction:column;gap:16px}
  .item{display:flex;align-items:baseline;gap:18px}
  .tk{font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;color:var(--silver-dim);width:120px;flex:none}
  .label{font-family:var(--font-mono);text-transform:uppercase}
</style>
</head>
<body>
  <div class="hd">Signal voice — Space Mono</div>
  <div class="row">
    <div class="item"><span class="tk">Label · 12 / 0.34em</span><span class="label" style="font-size:12px;letter-spacing:0.34em;color:var(--silver)">CURRENT TRANSMISSION</span></div>
    <div class="item"><span class="tk">Meta · 12</span><span style="font-family:var(--font-mono);font-size:12px;letter-spacing:0.08em;color:var(--silver)">REL 25.05.2026 · TOOLOST3001087656</span></div>
    <div class="item"><span class="tk">UI · 14</span><span style="font-family:var(--font-mono);font-size:14px;color:var(--porcelain)">Listen now →</span></div>
    <div class="item"><span class="tk">Micro · 10 / 0.34em</span><span class="label" style="font-size:10px;letter-spacing:0.34em;color:var(--silver-dim)">05 / LAUNCH ARC</span></div>
  </div>
</body>
</html>
