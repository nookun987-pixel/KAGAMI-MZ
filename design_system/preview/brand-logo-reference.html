<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--void);min-height:300px;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  figure{margin:0;position:relative;max-width:640px}
  img{display:block;width:100%;border:1px solid var(--hairline)}
  figcaption{position:absolute;left:10px;bottom:10px;font-family:var(--font-mono);font-size:9px;
    letter-spacing:0.3em;text-transform:uppercase;color:var(--silver-dim)}
  .badge{position:absolute;right:10px;top:10px;font-family:var(--font-mono);font-size:9px;letter-spacing:0.24em;
    text-transform:uppercase;color:var(--signal-pending);border:1px solid rgba(194,168,90,0.35);padding:3px 8px}
</style>
</head>
<body>
  <figure>
    <img src="../assets/brand/MIKAGE_LOGO_DIRECTION_REFERENCE_V1.png" alt="Mikage Zenith logo direction reference">
    <figcaption>DARK_SIGNAL_SIGIL_REFERENCE · style direction only</figcaption>
    <div class="badge">Logo · UNCONFIRMED</div>
  </figure>
</body>
</html>
