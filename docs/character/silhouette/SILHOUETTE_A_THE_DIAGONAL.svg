<svg viewBox="0 0 400 720" xmlns="http://www.w3.org/2000/svg" width="400" height="720">
  <title>SILHOUETTE_A — THE DIAGONAL</title>
  <rect width="400" height="720" fill="white"/>

  <!-- SWORD: massive rectangular slab, diagonal lower-right. No taper. -->
  <g transform="translate(272, 415) rotate(-20)">
    <rect x="-22" y="-255" width="44" height="315" rx="2" fill="black"/>
    <!-- Guard: thick horizontal bar -->
    <rect x="-44" y="-272" width="88" height="22" rx="2" fill="black"/>
  </g>

  <!-- HAIR MASS: large organic downward shape, left of center -->
  <path d="
    M 172,52
    C 150,44 120,58 100,92
    C 80,130 74,195 76,278
    C 78,355 88,435 106,505
    C 114,482 113,415 110,348
    C 107,278 114,212 132,170
    C 144,146 162,128 168,105
    Z
  " fill="black"/>

  <!-- CLOAK: secondary shape, flows left-back from shoulders -->
  <path d="
    M 153,225
    C 135,285 124,375 128,460
    C 131,520 140,562 150,578
    C 156,552 154,495 152,438
    C 150,370 153,305 160,255
    Z
  " fill="black"/>

  <!-- RIGHT ARM: holding sword grip at shoulder -->
  <path d="
    M 235,242 L 264,272 L 276,355
    L 260,360 L 248,280 L 222,252
    Z
  " fill="black"/>

  <!-- LEFT PAULDRON: wide flat plate -->
  <path d="M 66,185 L 172,185 L 164,218 L 74,218 Z" fill="black"/>

  <!-- RIGHT PAULDRON: wide flat plate -->
  <path d="M 210,185 L 332,185 L 324,218 L 202,218 Z" fill="black"/>

  <!-- SHOULDER BRIDGE -->
  <rect x="150" y="180" width="90" height="40" fill="black"/>

  <!-- CHEST -->
  <rect x="148" y="218" width="88" height="106" rx="3" fill="black"/>

  <!-- WAIST: slightly narrower -->
  <rect x="156" y="324" width="72" height="52" rx="3" fill="black"/>

  <!-- HIPS -->
  <rect x="146" y="376" width="92" height="58" rx="3" fill="black"/>

  <!-- LEFT LEG -->
  <rect x="146" y="432" width="42" height="218" rx="4" fill="black"/>

  <!-- RIGHT LEG -->
  <rect x="196" y="432" width="42" height="218" rx="4" fill="black"/>

  <!-- HELMET: elongated ovoid, slightly forward of center -->
  <ellipse cx="186" cy="116" rx="58" ry="74" fill="black"/>

  <!-- SENSOR SLITS: two ultra-thin horizontal void-black cuts -->
  <rect x="147" y="105" width="78" height="7" rx="3" fill="white"/>
  <rect x="147" y="122" width="78" height="7" rx="3" fill="white"/>

  <!-- LABEL -->
  <text x="200" y="690" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">A — THE DIAGONAL</text>
</svg>
