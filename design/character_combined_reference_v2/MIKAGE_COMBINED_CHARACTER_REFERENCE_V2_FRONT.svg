    <path d="M498,648 L507,768 L503,794 L470,794 L468,768 L470,648 Z"/>
  </g>
  <!-- panel reads: dark separation gaps + lighter overlap edges -->
  <g fill="none" stroke-linecap="round">
    <path d="M398,534 L400,720" stroke="#08080c" stroke-width="2"/>
    <path d="M430,532 L430,722" stroke="#08080c" stroke-width="2"/>
    <path d="M462,534 L460,720" stroke="#08080c" stroke-width="2"/>
    <path d="M403,540 L405,716" stroke="#34343e" stroke-width="1.2"/>
    <path d="M434,538 L434,718" stroke="#34343e" stroke-width="1.2"/>
    <path d="M467,540 L465,716" stroke="#34343e" stroke-width="1.2"/>
    <path d="M390,652 L390,790" stroke="#34343e" stroke-width="1.2"/>
    <path d="M470,652 L470,790" stroke="#34343e" stroke-width="1.2"/>
  </g>
  <g fill="none" stroke="#2c2c36" stroke-width="1.3"><path d="M430,330 L430,520"/><path d="M366,452 Q430,458 494,452"/></g>

