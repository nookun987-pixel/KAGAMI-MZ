  <use href="#helm" transform="translate(430,214) scale(0.92)" fill="#fafafa" stroke="#cbc7c0" stroke-width="1"/>
  <use href="#helmFacets" transform="translate(430,214) scale(0.92)" stroke="#b8b4ad" stroke-width="0.9"/>
