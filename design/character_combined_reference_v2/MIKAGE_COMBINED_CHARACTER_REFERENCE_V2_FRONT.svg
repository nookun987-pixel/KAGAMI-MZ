  <g fill="none" stroke="#8F00FF" stroke-width="5" stroke-linecap="round" opacity="0.45"><path d="M413,209 L425,211.5"/><path d="M447,209 L435,211.5"/></g>
  <g fill="none" stroke="#26262c" stroke-width="2.2" stroke-linecap="round"><path d="M413,209 L425,211.5"/><path d="M447,209 L435,211.5"/></g>

  <!-- Ensō MOVED to upper back (back view); front note only -->
  <text class="mono" x="600" y="300" font-size="8.5" fill="#9a8fd0" text-anchor="end">Ensō → upper back</text>
  <path d="M566,304 L520,322" stroke="#9a8fd0" stroke-width="0.8" fill="none"/>

  <text class="mono" x="454" y="888" font-size="11" letter-spacing="2" text-anchor="middle" fill="#1a1a22">FRONT — CANON-INTEGRATED (V2.1)</text>

  <!-- RULING / PALETTE KEY -->
  <g class="mono">
    <rect x="760" y="120" width="876" height="500" fill="#f4f2ee" stroke="#1a1a22" stroke-width="1"/>
    <text x="784" y="150" font-size="12" letter-spacing="2" fill="#1a1a22">OPERATOR RULINGS — HOW SHOWN IN V2</text>
    <line x1="784" y1="160" x2="1612" y2="160" stroke="#c9c6c0"/>
    <text x="784" y="184" font-size="10.5" fill="#1a1a22">1 · HAIR = REQUIRED</text>
    <text x="784" y="198" font-size="9" fill="#444">Long, heavy, black; wider mass at head + shoulders, straight vertical fall, tail clearly past the hip.</text>
    <text x="784" y="222" font-size="10.5" fill="#1a1a22">2 · FEMALE-CODED = REQUIRED (NON-SEXUAL)</text>
    <text x="784" y="236" font-size="9" fill="#444">Defined waist + long vertical column (hair + coat + skirt). No glamor/fanservice, no breast/waist/anatomy emphasis.</text>
    <text x="784" y="260" font-size="10.5" fill="#1a1a22">3 · VIOLET ACCENTS = CONTROLLED</text>
    <text x="784" y="274" font-size="9" fill="#444">Only (a) ultra-thin violet halo on the 2 sealed slits (the FRONT's only violet), (b) one Ensō ring on the UPPER BACK.</text>
    <text x="784" y="287" font-size="9" fill="#444">NO broad violet fill across plates.</text>
    <text x="784" y="311" font-size="10.5" fill="#1a1a22">4 · SACRED FLOW = REQUIRED</text>
    <text x="784" y="325" font-size="9" fill="#444">Knee executor coat + layered vertical skirt panels (outer panels reach toward the ankle) → ceremonial long-line flow.</text>
    <text x="784" y="349" font-size="10.5" fill="#1a1a22">5 · ALBEDO #FAFAFA · HEAD RATIO 7.1 (MASTER)</text>
    <text x="784" y="363" font-size="9" fill="#444">Porcelain armor base = white #FAFAFA; black graphene underlayer at joints; figure = 7.1 heads.</text>

    <line x1="784" y1="384" x2="1612" y2="384" stroke="#c9c6c0"/>
    <text x="784" y="406" font-size="11" letter-spacing="2" fill="#1a1a22">PALETTE (canon: white + black + violet only)</text>
    <g>
      <rect x="784" y="418" width="40" height="26" fill="#fafafa" stroke="#c9c6c0"/><text x="834" y="430" font-size="9.5" fill="#1a1a22">PORCELAIN #FAFAFA</text><text x="834" y="441" font-size="8.5" fill="#6a6a74">B4C white armor shell (dominant)</text>
      <rect x="784" y="450" width="40" height="26" fill="#16161c"/><text x="834" y="462" font-size="9.5" fill="#1a1a22">GARMENT/HAIR BLACK</text><text x="834" y="473" font-size="8.5" fill="#6a6a74">executor coat · skirt · long black hair</text>
      <rect x="784" y="482" width="40" height="26" fill="#24242b"/><text x="834" y="494" font-size="9.5" fill="#1a1a22">GRAPHENE #24242b</text><text x="834" y="505" font-size="8.5" fill="#6a6a74">black underlayer at joints (wrist/ankle/neck)</text>
      <rect x="784" y="514" width="40" height="26" fill="#8F00FF"/><text x="834" y="526" font-size="9.5" fill="#1a1a22">ELECTRIC VIOLET #8F00FF</text><text x="834" y="537" font-size="8.5" fill="#6a6a74">SIGNAL ONLY — slit halo + 1 Ensō; never a fill</text>
    </g>
    <line x1="784" y1="556" x2="1612" y2="556" stroke="#c9c6c0"/>
    <text x="784" y="576" font-size="9" fill="#6a6a74">Kept from locked draft: faceless sealed Kitsune helmet · exactly 2 sealed slits · no eyes/mouth/nose/skin · matte (no gloss).</text>
    <text x="784" y="590" font-size="9" fill="#6a6a74">Geometry-first (no lore phrasing per ruling Layer B). All values DRAFT, unconfirmed vs master Bible.</text>
    <text x="784" y="608" font-size="9" fill="#b03a2e">CANON_LOCK = NO · ASSET_LOCK = NO · RENDER_ALLOWED = NO — awaiting operator review of V2.</text>
  </g>

  <g class="mono">
    <line x1="44" y1="936" x2="1636" y2="936" stroke="#1a1a22" stroke-width="0.6"/>
    <text x="44" y="956" font-size="9.5" letter-spacing="1" fill="#3a3a42">V2.1 FRONT = locked V1.4 form + 5 operator rulings + patches (thicker hair · clearer skirt panels · Ensō moved to back) · palette white+black+violet</text>
    <text x="44" y="972" font-size="9.5" letter-spacing="1" fill="#6a6a74">CHUA_XAC_NHAN: V2 front is a DRAFT integration, not operator-approved · side/back/3-4 V2 + final palette tuning pending.   DRAFT · NOT CANON · NOT ASSET-LOCKED · NO RENDER.</text>
  </g>
