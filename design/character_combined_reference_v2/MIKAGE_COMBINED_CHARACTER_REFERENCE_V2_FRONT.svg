  <rect width="1680" height="1040" fill="#fbfaf8"/>
  <rect x="20" y="20" width="1640" height="1000" fill="none" stroke="#1a1a22" stroke-width="1.5"/>

  <text class="mono" x="44" y="50" font-size="12" letter-spacing="3" fill="#3a3a42">MIKAGE ZENITH STUDIO  ·  CHARACTER CAST LANE</text>
  <text class="mono" x="760" y="50" font-size="14" letter-spacing="3" text-anchor="middle" fill="#1a1a22">MIKAGE — CANON INTEGRATION REFERENCE V2 · FRONT</text>
  <text class="mono" x="1636" y="50" font-size="11" letter-spacing="2" text-anchor="end" fill="#b03a2e">DRAFT · NOT CANON · NOT ASSET-LOCKED · NO RENDER</text>
  <line x1="44" y1="66" x2="1636" y2="66" stroke="#1a1a22" stroke-width="0.8"/>
  <text class="mono" x="44" y="86" font-size="10.5" letter-spacing="2" fill="#6a6a74">Integrates 5 OPERATOR RULINGS (2026-06-03) onto the locked V1.4 form: long black hair · female-coded · controlled violet · sacred skirt-flow · #FAFAFA albedo · 7.1 head master</text>

