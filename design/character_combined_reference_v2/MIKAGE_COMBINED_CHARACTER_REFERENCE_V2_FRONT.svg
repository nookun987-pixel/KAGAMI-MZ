  <g fill="#16161c">
    <path d="M348,310 L334,360 L330,452 L338,545 L360,548 L362,452 L360,360 L356,314 Z"/>
    <path d="M512,310 L526,360 L530,452 L522,545 L500,548 L498,452 L500,360 L504,314 Z"/>
    <path d="M348,308 L356,360 L366,450 L362,500 L372,520 L488,520 L498,500 L494,450 L504,360 L512,308 Z"/>
    <path d="M372,520 L362,664 L366,724 L494,724 L498,664 L488,520 Z"/>
  </g>
