  <g fill="#fafafa">
    <path d="M392,330 L468,330 L472,392 Q430,408 388,392 Z"/>
    <path d="M340,306 C326,316 322,338 332,352 L362,346 L360,310 Z"/>
    <path d="M520,306 C534,316 538,338 528,352 L498,346 L500,310 Z"/>
    <path d="M338,548 L360,548 L360,576 Q349,582 338,576 Z"/>
    <path d="M522,548 L500,548 L500,576 Q511,582 522,576 Z"/>
  </g>
  <g fill="#2a2a33"><rect x="337" y="544" width="24" height="7" rx="3"/><rect x="499" y="544" width="24" height="7" rx="3"/></g>
  <g fill="none" stroke="#cbc7c0" stroke-width="1"><path d="M392,360 Q430,366 468,360"/><path d="M430,332 L430,400"/></g>

