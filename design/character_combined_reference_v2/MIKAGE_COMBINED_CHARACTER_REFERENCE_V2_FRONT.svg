    <g stroke="#e3e0d9" stroke-width="0.8">
      <line x1="142" y1="172" x2="700" y2="172"/><line x1="142" y1="262" x2="700" y2="262"/>
      <line x1="142" y1="450" x2="700" y2="450"/><line x1="142" y1="520" x2="700" y2="520" stroke="#d2cfc7" stroke-dasharray="5 4"/>
      <line x1="142" y1="720" x2="700" y2="720"/><line x1="142" y1="850" x2="700" y2="850" stroke="#9a978f"/>
    </g>
    <g text-anchor="end" fill="#3a3a42"><text x="138" y="176">0.0</text><text x="138" y="266">1.0</text><text x="138" y="454">3.0</text><text x="138" y="854">7.1</text></g>
    <g fill="#9a9790" font-size="8.5"><text x="60" y="176">CROWN</text><text x="60" y="259">CHIN</text><text x="60" y="517">HIP</text><text x="60" y="717">SKIRT HEM</text><text x="60" y="854">SOLE</text></g>
  </g>

  <rect x="208" y="120" width="492" height="788" rx="8" fill="#585863"/>

  <!-- 1. HAIR (thicker, heavy, vertical; tail clearly past hip) -->
  <g fill="#0d0d12">
    <path d="M410,200 C368,206 342,250 332,332 C325,430 332,572 360,706 L398,692 C384,560 380,428 388,344 C394,284 412,228 422,206 Z"/>
    <path d="M450,200 C492,206 518,250 528,332 C535,430 528,572 500,706 L462,692 C476,560 480,428 472,344 C466,284 448,228 438,206 Z"/>
    <path d="M402,190 Q430,178 458,190 L454,250 Q430,240 406,250 Z"/>
  </g>

  <!-- 2. legs: white porcelain shins + dark boots -->
  <g>
    <polygon points="406,720 424,720 421,812 408,812" fill="#fafafa"/>
    <polygon points="454,720 436,720 439,812 452,812" fill="#fafafa"/>
    <path d="M402,808 L424,808 L426,830 L432,845 L396,845 L396,828 Z" fill="#16161c"/>
    <path d="M458,808 L436,808 L434,830 L428,845 L464,845 L464,828 Z" fill="#16161c"/>
  </g>
  <g fill="#2a2a33"><rect x="406" y="804" width="18" height="7" rx="3"/><rect x="436" y="804" width="18" height="7" rx="3"/></g>

