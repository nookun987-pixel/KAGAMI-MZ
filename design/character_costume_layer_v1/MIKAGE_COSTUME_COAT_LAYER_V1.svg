    <path id="maskProfile" d="M-8,-52 L10,-50 L26,-34 L34,-16 L40,2 L34,18 L20,34 L6,46 L-8,48 L-24,34 L-36,10 L-40,-16 L-30,-42 Z"/>
  </defs>

  <rect width="1680" height="1040" fill="#fbfaf8"/>
  <rect x="20" y="20" width="1640" height="1000" fill="none" stroke="#1a1a22" stroke-width="1.5"/>

  <text class="mono" x="44" y="50" font-size="12" letter-spacing="3" fill="#3a3a42">MIKAGE ZENITH STUDIO  ·  CHARACTER CAST LANE</text>
  <text class="mono" x="840" y="50" font-size="15" letter-spacing="4" text-anchor="middle" fill="#1a1a22">MIKAGE — COSTUME COAT LAYER V1 · HIGH-COLLAR EXECUTOR</text>
  <text class="mono" x="1636" y="50" font-size="11" letter-spacing="2" text-anchor="end" fill="#b03a2e">STUDY DRAFT · NOT CANON · NOT ASSET-LOCKED · NO RENDER</text>
  <line x1="44" y1="66" x2="1636" y2="66" stroke="#1a1a22" stroke-width="0.8"/>
  <text class="mono" x="44" y="86" font-size="10.5" letter-spacing="2" fill="#6a6a74">FORM = MIKAGE_MODEL_SHEET_BASE_V1_4 (locked, UNCHANGED, shown as porcelain ghost) · coat layer only · grayscale · NO violet · NO cape · NO armor overload · NO fashion detail</text>

  <!-- legend: porcelain ghost vs coat -->
