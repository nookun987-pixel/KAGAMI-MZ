    <path d="M484,812 L446,812 L446,834 L450,846 L498,846 L498,836 L484,834 Z"/>
    <path d="M344,348 L329,372 L325,414 L326,450 L331,456 L332,512 L341,548 L350,561 L360,560 L361,549 L355,510 L352,456 L347,450 L344,408 L343,368 Z"/>
    <path d="M516,348 L531,372 L535,414 L534,450 L529,456 L528,512 L519,548 L510,561 L500,560 L499,549 L505,510 L508,456 L513,450 L516,408 L517,368 Z"/>
