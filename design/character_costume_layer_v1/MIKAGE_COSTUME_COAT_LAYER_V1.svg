    <rect x="360" y="100" width="22" height="13" fill="#837f76"/><text x="388" y="110" fill="#6a6a74">EXECUTOR COAT LAYER (this study)</text>
  </g>

  <!-- ============================== FRONT ============================== -->
  <!-- 1. porcelain ghost body (V1.4 front) -->
  <g fill="#c4c0b8">
