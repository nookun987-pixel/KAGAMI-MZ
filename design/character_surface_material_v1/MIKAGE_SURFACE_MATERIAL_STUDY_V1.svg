      <path d="M-34,-22 L-22,8"/><path d="M34,-22 L22,8"/>
      <path d="M-22,26 L0,46"/><path d="M22,26 L0,46"/>
    </g>
  </defs>

  <rect width="1680" height="1040" fill="#fbfaf8"/>
  <rect x="20" y="20" width="1640" height="1000" fill="none" stroke="#1a1a22" stroke-width="1.5"/>

  <text class="mono" x="44" y="50" font-size="12" letter-spacing="3" fill="#3a3a42">MIKAGE ZENITH STUDIO  ·  CHARACTER CAST LANE</text>
  <text class="mono" x="840" y="50" font-size="15" letter-spacing="5" text-anchor="middle" fill="#1a1a22">MIKAGE — SURFACE MATERIAL STUDY V1</text>
  <text class="mono" x="1636" y="50" font-size="11" letter-spacing="2" text-anchor="end" fill="#b03a2e">STUDY DRAFT · NOT CANON · NOT ASSET-LOCKED · NO RENDER</text>
  <line x1="44" y1="66" x2="1636" y2="66" stroke="#1a1a22" stroke-width="0.8"/>
  <text class="mono" x="44" y="86" font-size="10.5" letter-spacing="2" fill="#6a6a74">FORM SOURCE = MIKAGE_MODEL_SHEET_BASE_V1_4 (locked, UNCHANGED) · material language only · grayscale · NO violet signal yet · NO costume/coat · NO decorative armor · NO skin/eyes/mouth/nose</text>

  <!-- ================= MATERIAL ZONE MAP — front form (V1.4), recoloured by material ================= -->
  <!-- base porcelain shell (matte mid-grey) -->
  <g fill="#c4c0b8">
    <polygon points="372,512 422,520 418,668 380,672"/>
    <polygon points="382,680 418,676 412,816 392,818"/>
    <polygon points="488,512 438,520 442,668 480,672"/>
    <polygon points="478,680 442,676 448,816 468,818"/>
    <path d="M376,812 L414,812 L414,834 L410,846 L362,846 L362,836 L376,834 Z"/>
    <path d="M484,812 L446,812 L446,834 L450,846 L498,846 L498,836 L484,834 Z"/>
    <path d="M344,348 L329,372 L325,414 L326,450 L331,456 L332,512 L341,548 L350,561 L360,560 L361,549 L355,510 L352,456 L347,450 L344,408 L343,368 Z"/>
    <path d="M516,348 L531,372 L535,414 L534,450 L529,456 L528,512 L519,548 L510,561 L500,560 L499,549 L505,510 L508,456 L513,450 L516,408 L517,368 Z"/>
    <path d="M340,548 L360,548 L360,553 L367,557 L367,564 L359,569 L358,576 Q349,582 340,575 L338,552 Z"/>
    <path d="M520,548 L500,548 L500,553 L493,557 L493,564 L501,569 L502,576 Q511,582 520,575 L522,552 Z"/>
    <path d="M400,302 C376,306 356,320 346,348 C350,392 352,432 351,470 C350,492 352,506 360,518 L430,521 L500,518 C508,506 510,492 509,470 C508,432 510,392 514,348 C504,320 484,306 460,302 Z"/>
    <path d="M384,308 L394,266 L414,248 Q430,243 446,248 L466,266 L476,308 L456,320 Q430,326 404,320 Z"/>
    <use href="#maskKitsune" transform="translate(430,214) scale(0.92)"/>
  </g>

  <!-- porcelain SHADOW accents (form value, matte — not specular) -->
  <g fill="#9d9a92" opacity="0.85">
    <path d="M484,524 L500,518 C508,506 510,492 509,470 C508,452 508,432 509,416 L498,420 C500,452 498,486 492,508 Z"/>
    <path d="M325,414 L331,456 L332,500 L327,470 Z"/>
    <use href="#maskKitsune" transform="translate(430,214) scale(0.92)" fill="#9d9a92"/>
  </g>
  <!-- restore lit porcelain over shadow on mask (keep mid + a near-white raking plane) -->
  <use href="#maskKitsune" transform="translate(430,214) scale(0.92)" fill="#c4c0b8"/>
  <path d="M430,166 L450,176 L444,-0" fill="none"/>
  <path d="M412,178 L430,170 L444,180 L438,250 L430,262 L422,250 Z" fill="#e7e4de"/>

  <!-- GRAPHENE underlayer / joints (matte charcoal) -->
  <g fill="#24242b">
    <!-- neck / gorget base -->
    <path d="M404,310 L456,310 L452,322 Q430,328 408,322 Z"/>
    <!-- shoulders -->
    <rect x="340" y="344" width="18" height="12" rx="4"/>
    <rect x="502" y="344" width="18" height="12" rx="4"/>
    <!-- elbows -->
    <rect x="323" y="444" width="32" height="15" rx="5"/>
    <rect x="505" y="444" width="32" height="15" rx="5"/>
    <!-- wrists -->
    <rect x="337" y="541" width="26" height="10" rx="4"/>
    <rect x="497" y="541" width="26" height="10" rx="4"/>
    <!-- hip articulation -->
    <path d="M366,510 L494,510 L494,520 L430,523 L366,520 Z"/>
    <!-- knees -->
    <rect x="378" y="666" width="42" height="16" rx="5"/>
    <rect x="440" y="666" width="42" height="16" rx="5"/>
    <!-- ankles -->
    <rect x="389" y="807" width="26" height="10" rx="4"/>
    <rect x="445" y="807" width="26" height="10" rx="4"/>
  </g>

  <!-- minimal recessed panel SEAMS (porcelain) -->
  <g fill="none" stroke="#74716a" stroke-width="1.1" stroke-linecap="round">
    <path d="M356,332 Q430,322 504,332"/>
    <path d="M360,400 Q430,418 500,400"/>
    <path d="M430,360 L430,400"/>
    <path d="M364,440 Q430,446 496,440"/>
    <path d="M372,478 Q430,483 488,478"/>
  </g>
  <use href="#maskFacets" transform="translate(430,214) scale(0.92)" stroke="#8a877f" stroke-width="0.9" fill="none"/>

  <!-- SEALED slit grooves -->
  <g fill="none" stroke="#3a3a42" stroke-width="2.2" stroke-linecap="round">
    <path d="M430,214 m-17.5,-5.5 l12.9,2.8" transform=""/>
  </g>
  <g fill="none" stroke="#3a3a42" stroke-width="2.4" stroke-linecap="round">
    <path d="M413,209 L425,211.5"/>
    <path d="M447,209 L435,211.5"/>
  </g>

  <text class="mono" x="430" y="892" font-size="12" letter-spacing="2" text-anchor="middle" fill="#1a1a22">MATERIAL ZONE MAP — FRONT</text>
  <text class="mono" x="430" y="909" font-size="8.5" letter-spacing="1" text-anchor="middle" fill="#6a6a74">form = V1.4 locked · fills = material, not render</text>

  <!-- ================= CALLOUTS ================= -->
  <g class="mono" font-size="9.5" fill="#3a3a42">
    <g stroke="#9a978f" stroke-width="0.8" fill="none">
      <path d="M430,210 L600,150"/>
      <path d="M470,310 L600,250"/>
      <path d="M470,400 L600,330"/>
      <path d="M537,451 L600,470"/>
      <path d="M459,666 L600,690"/>
    </g>
    <text x="606" y="146">SEALED SENSOR SLITS — flush engraved grooves;</text>
    <text x="606" y="159" fill="#6a6a74">no emitter glow now (violet = later SIGNAL, not material).</text>
    <text x="606" y="246">GORGET SEAM — porcelain collar over graphene neck;</text>
    <text x="606" y="259" fill="#6a6a74">single recessed seam where mask meets gorget.</text>
    <text x="606" y="326">MATTE PORCELAIN SHELL — unglazed B4C bisque, fine</text>
    <text x="606" y="339" fill="#6a6a74">ceramic micro-grain; NO gloss, NO specular hotspot.</text>
    <text x="606" y="466">GRAPHENE UNDERLAYER — matte charcoal at every</text>
    <text x="606" y="479" fill="#6a6a74">joint: neck·shoulder·elbow·wrist·hip·knee·ankle.</text>
    <text x="606" y="686">MINIMAL PANEL SEAMS — recessed hairlines only</text>
    <text x="606" y="699" fill="#6a6a74">(breastplate · abdominal · plane-breaks); no decoration.</text>
  </g>

  <!-- ================= VALUE / MATERIAL KEY ================= -->
  <g class="mono">
    <rect x="1066" y="120" width="572" height="470" fill="#f4f2ee" stroke="#1a1a22" stroke-width="1"/>
    <text x="1086" y="150" font-size="12" letter-spacing="2" fill="#1a1a22">VALUE / MATERIAL KEY</text>
    <line x1="1086" y1="160" x2="1618" y2="160" stroke="#c9c6c0"/>

    <g>
      <rect x="1086" y="176" width="40" height="28" fill="#050508"/>
      <text x="1136" y="188" font-size="10" fill="#1a1a22">VOID BLACK #050508</text>
      <text x="1136" y="200" font-size="9" fill="#6a6a74">deep recesses · plate gaps · behind-shell · slit core</text>

      <rect x="1086" y="214" width="40" height="28" fill="#24242b"/>
      <text x="1136" y="226" font-size="10" fill="#1a1a22">GRAPHENE CHARCOAL #24242b</text>
      <text x="1136" y="238" font-size="9" fill="#6a6a74">matte substrate at joints / underlayer · no sheen</text>

      <rect x="1086" y="252" width="40" height="28" fill="#8d8a83"/>
      <text x="1136" y="264" font-size="10" fill="#1a1a22">PORCELAIN SHADOW #8d8a83</text>
      <text x="1136" y="276" font-size="9" fill="#6a6a74">shell turned from light (matte falloff)</text>

      <rect x="1086" y="290" width="40" height="28" fill="#c4c0b8"/>
      <text x="1136" y="302" font-size="10" fill="#1a1a22">PORCELAIN MID #c4c0b8</text>
      <text x="1136" y="314" font-size="9" fill="#6a6a74">dominant shell body matte midtone</text>

      <rect x="1086" y="328" width="40" height="28" fill="#ece9e3"/>
      <text x="1136" y="340" font-size="10" fill="#1a1a22">PORCELAIN HIGHLIGHT #ece9e3</text>
      <text x="1136" y="352" font-size="9" fill="#6a6a74">raking-light plane only · near-white but MATTE (no hotspot)</text>

      <rect x="1086" y="366" width="40" height="28" fill="#3a3a42"/>
      <text x="1136" y="378" font-size="10" fill="#1a1a22">SLIT GROOVE #3a3a42</text>
      <text x="1136" y="390" font-size="9" fill="#6a6a74">sealed engraved sensor slit (flush, closed)</text>
    </g>

    <line x1="1086" y1="406" x2="1618" y2="406" stroke="#c9c6c0"/>
    <text x="1086" y="424" font-size="10.5" letter-spacing="1" fill="#1a1a22">WHAT STAYS BLACK / WHITE / GREY (future render)</text>
    <text x="1086" y="442" font-size="9" fill="#444">BLACK → graphene joints, deep recesses, plate-gap shadow, slit cores (matte, never glossy black).</text>
    <text x="1086" y="456" font-size="9" fill="#444">WHITE → only raking-light porcelain planes (cheek / brow / chest crest); sparing; matte, never a specular dot.</text>
    <text x="1086" y="470" font-size="9" fill="#444">GREY → the dominant read: matte porcelain shell across most of the figure.</text>
    <text x="1086" y="490" font-size="9" fill="#444">MATTE LOCK → no gloss / chrome / subsurface glow / specular; unglazed ceramic micro-grain.</text>
    <text x="1086" y="504" font-size="9" fill="#444">VIOLET → NOT a material; reserved as a later SIGNAL (slit/halo), absent from this study.</text>
    <text x="1086" y="524" font-size="9" fill="#6a6a74">CONTRAST INTENT → mostly mid-grey shell; black graphene reads the articulation; white used as a thin accent.</text>
    <text x="1086" y="544" font-size="9" fill="#6a6a74">SURFACE → calm, heavy, light-absorbing porcelain; slow soft falloff, no hard rim unless raking key light.</text>
    <text x="1086" y="566" font-size="9" fill="#9a9790">All values PROPOSED / UNCONFIRMED vs master Bible · STUDY DRAFT only.</text>
  </g>

  <!-- footer -->
  <g class="mono">
    <line x1="44" y1="936" x2="1636" y2="936" stroke="#1a1a22" stroke-width="0.6"/>
    <text x="44" y="956" font-size="9.5" letter-spacing="1" fill="#3a3a42">MATERIAL LANGUAGE = matte porcelain shell (grey) + graphene underlayer at joints (charcoal) + sealed slit grooves + recessed gorget/panel seams · form UNCHANGED from V1.4</text>
    <text x="44" y="972" font-size="9.5" letter-spacing="1" fill="#6a6a74">CHUA_XAC_NHAN: material zones are a STUDY proposal, not operator-approved · exact tones/contrast unconfirmed vs master.   STUDY DRAFT · NOT CANON · NOT ASSET-LOCKED · NO RENDER.</text>
  </g>
</svg>
