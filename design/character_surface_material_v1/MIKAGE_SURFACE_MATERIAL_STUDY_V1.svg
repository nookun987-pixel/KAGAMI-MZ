<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1040" width="1680" height="1040" font-family="ui-monospace, 'Space Mono', monospace">
  <defs>
    <style>.mono{font-family:ui-monospace,'Space Mono',monospace;} text{fill:#3a3a42;}</style>
    <path id="maskKitsune" d="M0,-52 L20,-44 L34,-22 L33,2 L24,24 L12,42 L0,52 L-12,42 L-24,24 L-33,2 L-34,-22 L-20,-44 Z"/>
    <g id="maskFacets" fill="none">
