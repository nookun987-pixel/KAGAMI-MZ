<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1414" width="1000" height="1414" font-family="'Space Mono', ui-monospace, monospace">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Shippori+Mincho:wght@500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap');
      .word{font-family:'Cinzel',serif;}
      .serif{font-family:'Shippori Mincho',serif;}
      .mono{font-family:'Space Mono',ui-monospace,monospace;}
    </style>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
    <radialGradient id="violetHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8f00ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8f00ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="porc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f1ec"/>
      <stop offset="55%" stop-color="#e7e3dc"/>
      <stop offset="100%" stop-color="#cfcbc4"/>
    </linearGradient>
  </defs>

  <!-- void canvas -->
  <rect width="1000" height="1414" fill="#050508"/>
  <rect width="1000" height="1414" filter="url(#grain)" opacity="0.5"/>
  <circle cx="430" cy="600" r="250" fill="url(#violetHalo)"/>

  <!-- corner registration ticks -->
  <g stroke="#a0a0b0" stroke-opacity="0.5" stroke-width="1" fill="none">
    <path d="M34 54 H64 M34 54 V84"/><path d="M966 54 H936 M966 54 V84"/>
    <path d="M34 1360 H64 M34 1360 V1330"/><path d="M966 1360 H936 M966 1360 V1330"/>
  </g>

  <!-- header -->
  <text class="mono" x="60" y="64" font-size="11" letter-spacing="3" fill="#a0a0b0">MIKAGE ZENITH STUDIO</text>
  <text class="mono" x="60" y="82" font-size="10" letter-spacing="3" fill="#6b6b78">CHARACTER CAST LANE · WEAPON</text>
  <text class="word" x="500" y="76" font-size="27" letter-spacing="11" text-anchor="middle" fill="#f2eeea">MIKAGE ZENITH</text>
  <text class="mono" x="940" y="64" font-size="11" letter-spacing="3" text-anchor="end" fill="#a0a0b0">REV V2.5</text>
  <text class="mono" x="940" y="82" font-size="10" letter-spacing="3" text-anchor="end" fill="#6b6b78">STRUCTURE CANON · LOCKED V2.5</text>
  <line x1="60" y1="100" x2="940" y2="100" stroke="#242436"/>

  <!-- title block -->
  <text class="serif" x="500" y="150" font-size="24" letter-spacing="3" text-anchor="middle" fill="#f2eeea">ZENITH BLADE · PRIMETOOL</text>
  <circle cx="300" cy="176" r="4" fill="#9d7fd0"/>
  <text class="mono" x="500" y="181" font-size="13" letter-spacing="4" text-anchor="middle" fill="#c8c4be">P1 · COMPACT-IDLE — IMPERIAL CLEAN</text>

  <!-- ================= P1 COMPACT-IDLE — closed B4C brutal block ================= -->
  <g stroke="#9a968f" stroke-linejoin="round" stroke-linecap="round">
    <!-- main brutal slab block (closed B4C shell) -->
    <path d="M430 250 L508 366 L508 892 L352 892 L352 366 Z" fill="url(#porc)" stroke-width="2"/>
    <!-- top bevel highlight -->
    <path d="M430 250 L508 366 L352 366 Z" fill="#f4f1ec" stroke-width="1.4"/>
    <!-- right shade face (volume) -->
    <path d="M508 366 L508 892 L470 892 L470 366 Z" fill="#cfcbc4" stroke="none"/>
    <!-- dormant plate split-seams (where B4C will crack in P2/P3) -->
    <g stroke="#b8b4ac" stroke-width="1">
      <line x1="352" y1="470" x2="508" y2="470"/>
      <line x1="352" y1="600" x2="508" y2="600"/>
      <line x1="352" y1="730" x2="508" y2="730"/>
      <line x1="430" y1="366" x2="430" y2="892" stroke="#c4c0b8" stroke-dasharray="2 8"/>
    </g>
    <!-- micro chamfer edges -->
    <g stroke="#e7e3dc" stroke-width="0.8">
      <line x1="360" y1="372" x2="360" y2="886"/><line x1="500" y1="372" x2="500" y2="886"/>
    </g>
    <!-- dim ferro-calcium core hint (hidden, barely glowing through center seam) -->
    <line x1="430" y1="392" x2="430" y2="866" stroke="#e60000" stroke-width="2" stroke-opacity="0.16"/>
    <circle cx="430" cy="630" r="7" fill="#e60000" fill-opacity="0.18" stroke="#e60000" stroke-opacity="0.25" stroke-width="1"/>

    <!-- collar / guard -->
    <rect x="392" y="892" width="76" height="22" fill="#d8d4cd" stroke-width="1.5"/>
    <!-- grip block (integrated, brutal) -->
    <rect x="402" y="914" width="56" height="120" fill="url(#porc)" stroke-width="1.6"/>
    <g stroke="#b8b4ac" stroke-width="1"><line x1="402" y1="952" x2="458" y2="952"/><line x1="402" y1="992" x2="458" y2="992"/></g>
    <!-- pommel + flux-pinning back mount -->
    <path d="M408 1034 L452 1034 L444 1074 L416 1074 Z" fill="#d8d4cd" stroke-width="1.5"/>
  </g>
  <!-- flux-pinning magnetic mount glyph -->
  <g stroke="#9d7fd0" stroke-width="1" fill="none"><circle cx="430" cy="1054" r="8"/><circle cx="430" cy="1054" r="3"/></g>

  <!-- ================= ANNOTATIONS ================= -->
  <g class="mono" fill="#c8c4be" font-size="12" letter-spacing="1.5">
    <!-- 01 B4C shell -->
    <line x1="508" y1="430" x2="700" y2="410" stroke="#3d2e55" stroke-width="1"/>
    <circle cx="508" cy="430" r="3" fill="#9d7fd0" stroke="none"/>
    <text x="710" y="406" fill="#a0a0b0" font-size="10" letter-spacing="3">01</text>
    <text x="710" y="422">B4C PORCELAIN SHELL · SEALED</text>
    <text x="710" y="439" fill="#6b6b78" font-size="11">#FAFAFA matte · sterile · 100% vô trùng</text>

    <!-- 02 split seams -->
    <line x1="508" y1="600" x2="700" y2="600" stroke="#3d2e55" stroke-width="1"/>
    <circle cx="508" cy="600" r="3" fill="#9d7fd0" stroke="none"/>
    <text x="710" y="588" fill="#a0a0b0" font-size="10" letter-spacing="3">02</text>
    <text x="710" y="604">DORMANT SPLIT-SEAMS</text>
    <text x="710" y="621" fill="#6b6b78" font-size="11">plates contracted · open as Kintsugi in P2/P3</text>

    <!-- 03 dim core (left) -->
    <line x1="423" y1="630" x2="250" y2="610" stroke="#3d2e55" stroke-width="1"/>
    <circle cx="423" cy="630" r="3" fill="#e60000" stroke="none"/>
    <text x="246" y="598" text-anchor="end" fill="#a0a0b0" font-size="10" letter-spacing="3">03</text>
    <text x="246" y="614" text-anchor="end">FERRO-CALCIUM CORE</text>
    <text x="246" y="631" text-anchor="end" fill="#6b6b78" font-size="11">dim · idle 43°C · radiation-suppressed</text>

    <!-- 04 Ti frame dormant (left) -->
    <line x1="360" y1="760" x2="250" y2="780" stroke="#3d2e55" stroke-width="1"/>
    <circle cx="360" cy="760" r="3" fill="#9d7fd0" stroke="none"/>
    <text x="246" y="768" text-anchor="end" fill="#a0a0b0" font-size="10" letter-spacing="3">04</text>
    <text x="246" y="784" text-anchor="end">Ti FRAME · DORMANT INSIDE</text>
    <text x="246" y="801" text-anchor="end" fill="#6b6b78" font-size="11">hidden until shell splits</text>

    <!-- 05 flux mount -->
    <line x1="430" y1="1054" x2="700" y2="1054" stroke="#3d2e55" stroke-width="1"/>
    <circle cx="446" cy="1054" r="3" fill="#9d7fd0" stroke="none"/>
    <text x="710" y="1042" fill="#a0a0b0" font-size="10" letter-spacing="3">05</text>
    <text x="710" y="1058">FLUX-PINNING MOUNT</text>
    <text x="710" y="1075" fill="#6b6b78" font-size="11">clings to back · 0.5mm micro-vibration</text>
  </g>

  <!-- mass tag -->
  <text class="serif" x="250" y="300" font-size="34" text-anchor="end" fill="#f2eeea">350</text>
  <text class="mono" x="250" y="318" font-size="11" letter-spacing="3" text-anchor="end" fill="#a0a0b0">KILOGRAMS</text>

  <!-- bottom spec strip -->
  <line x1="60" y1="1240" x2="940" y2="1240" stroke="#242436"/>
  <g class="mono" font-size="11" letter-spacing="1.5">
    <text x="60" y="1276" fill="#a0a0b0">OUTER SHELL</text>
    <text x="60" y="1294" fill="#6b6b78" font-size="10">B4C porcelain #FAFAFA · closed block</text>
    <text x="340" y="1276" fill="#a0a0b0">INNER</text>
    <text x="340" y="1294" fill="#6b6b78" font-size="10">Black Ti frame + Ferro-Ca core (dormant)</text>
    <text x="640" y="1276" fill="#a0a0b0">UI / CORE</text>
    <text x="640" y="1294" fill="#6b6b78" font-size="10">Orbital Logic OFF · core dim 43°C</text>
    <text x="940" y="1276" fill="#a0a0b0" text-anchor="end">PHASE</text>
    <text x="940" y="1294" fill="#9d7fd0" font-size="10" text-anchor="end">P1 · COMPACT-IDLE</text>
  </g>
  <text class="mono" x="60" y="1340" font-size="9" letter-spacing="2" fill="#6b6b78">CLEAN VECTOR BLUEPRINT · DETERMINISTIC · NOT AN AI RENDER</text>
  <text class="mono" x="940" y="1340" font-size="9" letter-spacing="2" fill="#6b6b78" text-anchor="end">STRUCTURE CANON · RENDERS = REVIEW-CANDIDATE</text>
</svg>
