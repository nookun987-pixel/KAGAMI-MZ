<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1414" width="1000" height="1414" font-family="'Space Mono', ui-monospace, monospace">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Shippori+Mincho:wght@500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap');
      .word{font-family:'Cinzel',serif;}
      .serif{font-family:'Shippori Mincho',serif;}
      .mono{font-family:'Space Mono',ui-monospace,monospace;}
    </style>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
    <radialGradient id="violetHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8f00ff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#9d7fd0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8f00ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreDim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e60000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e60000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- void canvas -->
  <rect width="1000" height="1414" fill="#050508"/>
  <rect width="1000" height="1414" filter="url(#grain)" opacity="0.5"/>
  <!-- single violet signal halo behind hilt -->
  <circle cx="430" cy="828" r="240" fill="url(#violetHalo)"/>

  <!-- corner registration ticks -->
  <g stroke="#a0a0b0" stroke-opacity="0.5" stroke-width="1" fill="none">
    <path d="M34 54 H64 M34 54 V84"/>
    <path d="M966 54 H936 M966 54 V84"/>
    <path d="M34 1360 H64 M34 1360 V1330"/>
    <path d="M966 1360 H936 M966 1360 V1330"/>
  </g>

  <!-- header -->
  <text class="mono" x="60" y="64" font-size="11" letter-spacing="3" fill="#a0a0b0">MIKAGE ZENITH STUDIO</text>
  <text class="mono" x="60" y="82" font-size="10" letter-spacing="3" fill="#6b6b78">CHARACTER CAST LANE · WEAPON</text>
  <text class="word" x="500" y="76" font-size="27" letter-spacing="11" text-anchor="middle" fill="#f2eeea">MIKAGE ZENITH</text>
  <text class="mono" x="940" y="64" font-size="11" letter-spacing="3" text-anchor="end" fill="#a0a0b0">REV V2.5</text>
  <text class="mono" x="940" y="82" font-size="10" letter-spacing="3" text-anchor="end" fill="#6b6b78">REFERENCE ONLY · NOT ASSET-LOCKED</text>
  <line x1="60" y1="100" x2="940" y2="100" stroke="#242436"/>

  <!-- title block -->
  <text class="serif" x="500" y="150" font-size="24" letter-spacing="3" text-anchor="middle" fill="#f2eeea">ZENITH BLADE · PRIMETOOL</text>
  <circle cx="346" cy="176" r="4" fill="#9d7fd0"/>
  <text class="mono" x="500" y="181" font-size="13" letter-spacing="5" text-anchor="middle" fill="#c8c4be">STATE 01 — REST / NON-COMBAT</text>

  <!-- ================= BLADE (REST, ornate) ================= -->
  <g stroke="#f2eeea" fill="none" stroke-linejoin="round" stroke-linecap="round">

    <!-- blade body (slender pointed) -->
    <path d="M430 236 L446 470 L452 720 L448 800 L412 800 L408 720 L414 470 Z" stroke-width="1.8" fill="#0d0d14"/>
    <!-- central fuller ridge -->
    <line x1="430" y1="262" x2="430" y2="792" stroke="#a0a0b0" stroke-width="1"/>
    <!-- engraved data-lines -->
    <g stroke="#6b6b78" stroke-width="0.7">
      <line x1="430" y1="320" x2="430" y2="780" stroke-dasharray="2 10"/>
      <line x1="420" y1="470" x2="440" y2="470"/>
      <line x1="419" y1="540" x2="441" y2="540"/>
      <line x1="418" y1="610" x2="442" y2="610"/>
      <line x1="417" y1="680" x2="443" y2="680"/>
      <line x1="416" y1="750" x2="444" y2="750"/>
    </g>

    <!-- upper collar / ricasso -->
    <rect x="404" y="800" width="52" height="18" stroke-width="1.5" fill="#1a1a28"/>

    <!-- crossguard side lugs -->
    <path d="M404 812 L336 818 L330 842 L404 838 Z" stroke-width="1.4" fill="#1a1a28"/>
    <path d="M456 812 L524 818 L530 842 L456 838 Z" stroke-width="1.4" fill="#1a1a28"/>
    <rect x="330" y="820" width="14" height="20" stroke-width="1" fill="#0d0d14"/>
    <rect x="516" y="820" width="14" height="20" stroke-width="1" fill="#0d0d14"/>

    <!-- circular drive mechanism (hilt) -->
    <circle cx="430" cy="858" r="72" stroke-width="2" fill="#0d0d14"/>
    <circle cx="430" cy="858" r="54" stroke-width="1.2"/>
    <circle cx="430" cy="858" r="34" stroke-width="1.2" stroke="#a0a0b0"/>
    <g stroke="#6b6b78" stroke-width="0.8">
      <line x1="430" y1="786" x2="430" y2="930"/>
      <line x1="358" y1="858" x2="502" y2="858"/>
      <line x1="379" y1="807" x2="481" y2="909"/>
      <line x1="481" y1="807" x2="379" y2="909"/>
    </g>
    <!-- ferro-calcium core, DIM in rest -->
    <circle cx="430" cy="858" r="30" fill="url(#coreDim)"/>
    <circle cx="430" cy="858" r="13" fill="#e60000" fill-opacity="0.5" stroke="#e60000" stroke-opacity="0.7" stroke-width="1"/>

    <!-- telescoping segmented column (grip) -->
    <g stroke-width="1.5" fill="#0d0d14">
      <rect x="408" y="930" width="44" height="46"/>
      <rect x="402" y="976" width="56" height="40"/>
      <rect x="410" y="1016" width="40" height="44"/>
      <rect x="404" y="1060" width="52" height="38"/>
      <rect x="412" y="1098" width="36" height="42"/>
    </g>
    <g stroke="#6b6b78" stroke-width="0.7">
      <line x1="408" y1="953" x2="452" y2="953"/>
      <line x1="402" y1="996" x2="458" y2="996"/>
      <line x1="410" y1="1038" x2="450" y2="1038"/>
      <line x1="404" y1="1079" x2="456" y2="1079"/>
    </g>
    <!-- pommel / flux-pinning mount -->
    <path d="M412 1140 L448 1140 L440 1172 L420 1172 Z" stroke-width="1.5" fill="#1a1a28"/>
    <circle cx="430" cy="1156" r="6" stroke-width="1" stroke="#9d7fd0"/>
  </g>

  <!-- ================= ANNOTATIONS ================= -->
  <g class="mono" fill="#c8c4be" font-size="12" letter-spacing="1.5">
    <!-- 01 blade -->
    <line x1="452" y1="470" x2="690" y2="430" stroke="#3d2e55" stroke-width="1"/>
    <circle cx="452" cy="470" r="3" fill="#9d7fd0" stroke="none"/>
    <text x="700" y="426" fill="#a0a0b0" font-size="10" letter-spacing="3">01</text>
    <text x="700" y="442">SLENDER BLADE</text>
    <text x="700" y="459" fill="#6b6b78" font-size="11">engraved data-lines · convex taper</text>

    <!-- 02 mechanism -->
    <line x1="502" y1="858" x2="690" y2="858" stroke="#3d2e55" stroke-width="1"/>
    <circle cx="502" cy="858" r="3" fill="#9d7fd0" stroke="none"/>
    <text x="700" y="846" fill="#a0a0b0" font-size="10" letter-spacing="3">02</text>
    <text x="700" y="862">CIRCULAR DRIVE MECHANISM</text>
    <text x="700" y="879" fill="#6b6b78" font-size="11">concentric hub · brand-identity anchor</text>

    <!-- 03 core (left) -->
    <line x1="400" y1="858" x2="250" y2="858" stroke="#3d2e55" stroke-width="1"/>
    <circle cx="400" cy="858" r="3" fill="#e60000" stroke="none"/>
    <text x="246" y="846" text-anchor="end" fill="#a0a0b0" font-size="10" letter-spacing="3">03</text>
    <text x="246" y="862" text-anchor="end">FERRO-CALCIUM CORE</text>
    <text x="246" y="879" text-anchor="end" fill="#6b6b78" font-size="11">dim · idle 43°C · no glow</text>

    <!-- 04 column -->
    <line x1="458" y1="1010" x2="690" y2="1010" stroke="#3d2e55" stroke-width="1"/>
    <circle cx="458" cy="1010" r="3" fill="#9d7fd0" stroke="none"/>
    <text x="700" y="998" fill="#a0a0b0" font-size="10" letter-spacing="3">04</text>
    <text x="700" y="1014">TELESCOPING COLUMN</text>
    <text x="700" y="1031" fill="#6b6b78" font-size="11">segmented · extends on activation</text>

    <!-- 05 mount (left) -->
    <line x1="412" y1="1156" x2="250" y2="1156" stroke="#3d2e55" stroke-width="1"/>
    <circle cx="412" cy="1156" r="3" fill="#9d7fd0" stroke="none"/>
    <text x="246" y="1144" text-anchor="end" fill="#a0a0b0" font-size="10" letter-spacing="3">05</text>
    <text x="246" y="1160" text-anchor="end">FLUX-PINNING MOUNT</text>
    <text x="246" y="1177" text-anchor="end" fill="#6b6b78" font-size="11">back-carry · ghim từ thông</text>
  </g>

  <!-- mass tag + length dimension (left) -->
  <g stroke="#6b6b78" stroke-width="0.8" fill="none">
    <line x1="300" y1="236" x2="300" y2="800"/>
    <path d="M296 240 L300 232 L304 240 M296 796 L300 804 L304 796"/>
  </g>
  <text class="mono" x="312" y="520" font-size="10" letter-spacing="2" fill="#6b6b78" transform="rotate(-90 312 520)" text-anchor="middle">BLADE LENGTH · VARIABLE 35–58 IN</text>
  <text class="serif" x="250" y="300" font-size="34" text-anchor="end" fill="#f2eeea">350</text>
  <text class="mono" x="250" y="318" font-size="11" letter-spacing="3" text-anchor="end" fill="#a0a0b0">KILOGRAMS</text>

  <!-- bottom spec strip -->
  <line x1="60" y1="1240" x2="940" y2="1240" stroke="#242436"/>
  <g class="mono" font-size="11" letter-spacing="1.5">
    <text x="60" y="1276" fill="#a0a0b0">MATERIAL</text>
    <text x="60" y="1294" fill="#6b6b78" font-size="10">Black rusty Ti plates / Ferro-Ca core</text>
    <text x="320" y="1276" fill="#a0a0b0">LINKAGE</text>
    <text x="320" y="1294" fill="#6b6b78" font-size="10">Flux-Pinning · 0.5 mm micro-vibration</text>
    <text x="600" y="1276" fill="#a0a0b0">UI · ORBITAL LOGIC</text>
    <text x="600" y="1294" fill="#6b6b78" font-size="10">OFF in REST state</text>
    <text x="940" y="1276" fill="#a0a0b0" text-anchor="end">CORE</text>
    <text x="940" y="1294" fill="#6b6b78" font-size="10" text-anchor="end">#E60000 · idle 43°C</text>
  </g>
  <text class="mono" x="60" y="1340" font-size="9" letter-spacing="2" fill="#6b6b78">CLEAN VECTOR BLUEPRINT · DETERMINISTIC · NOT AN AI RENDER</text>
  <text class="mono" x="940" y="1340" font-size="9" letter-spacing="2" fill="#6b6b78" text-anchor="end">REFERENCE-ONLY · NO CANON/ASSET-LOCK</text>
</svg>
