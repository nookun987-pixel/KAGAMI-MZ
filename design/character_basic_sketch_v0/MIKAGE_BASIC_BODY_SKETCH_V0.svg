<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="1500" height="1010" font-family="ui-monospace, 'Space Mono', monospace">
  <defs>
    <style>
      .mono{font-family:ui-monospace,'Space Mono',monospace;}
      text{fill:#3a3a42;}
    </style>
  </defs>

  <!-- paper -->
  <rect width="1500" height="1010" fill="#fbfaf8"/>

  <!-- frame -->
  <rect x="20" y="20" width="1460" height="970" fill="none" stroke="#1a1a22" stroke-width="1.5"/>

  <!-- header -->
  <text class="mono" x="44" y="50" font-size="12" letter-spacing="3" fill="#3a3a42">MIKAGE ZENITH STUDIO  ·  CHARACTER CAST LANE</text>
  <text class="mono" x="750" y="50" font-size="15" letter-spacing="6" text-anchor="middle" fill="#1a1a22">MIKAGE — BASIC BODY SKETCH  V0</text>
  <text class="mono" x="1456" y="50" font-size="12" letter-spacing="3" text-anchor="end" fill="#3a3a42">REV V0 · DRAFT</text>
  <line x1="44" y1="66" x2="1456" y2="66" stroke="#1a1a22" stroke-width="0.8"/>
  <text class="mono" x="44" y="86" font-size="10.5" letter-spacing="2" fill="#6a6a74">FOUNDATION FORM ONLY · NO RENDER · NO COLOR · NO LORE · NO COSTUME DETAIL · PROPORTIONS PROPOSED / UNCONFIRMED</text>

  <!-- ================= PROPORTION RULER (head units) ================= -->
  <g class="mono" font-size="10" fill="#6a6a74">
    <line x1="150" y1="170" x2="150" y2="845" stroke="#9a978f" stroke-width="1"/>
    <!-- unit ticks at 0..7, head unit u=90, topY=170 -->
    <g stroke="#9a978f" stroke-width="0.8">
      <line x1="142" y1="170" x2="1320" y2="170" stroke="#e0ddd6"/>
      <line x1="142" y1="260" x2="1320" y2="260" stroke="#e0ddd6"/>
      <line x1="142" y1="350" x2="1320" y2="350" stroke="#e0ddd6"/>
      <line x1="142" y1="440" x2="1320" y2="440" stroke="#e0ddd6"/>
      <line x1="142" y1="521" x2="1320" y2="521" stroke="#d2cfc7" stroke-dasharray="5 4"/>
      <line x1="142" y1="530" x2="1320" y2="530" stroke="#e0ddd6"/>
      <line x1="142" y1="620" x2="1320" y2="620" stroke="#e0ddd6"/>
      <line x1="142" y1="674" x2="1320" y2="674" stroke="#e0ddd6"/>
      <line x1="142" y1="710" x2="1320" y2="710" stroke="#e0ddd6"/>
      <line x1="142" y1="800" x2="1320" y2="800" stroke="#e0ddd6"/>
      <line x1="142" y1="822" x2="1320" y2="822" stroke="#e0ddd6"/>
      <line x1="142" y1="845" x2="1320" y2="845" stroke="#9a978f"/>
    </g>
    <!-- head-unit numbers -->
    <g text-anchor="end" fill="#3a3a42">
      <text x="138" y="174">0.0</text>
      <text x="138" y="264">1.0</text>
      <text x="138" y="354">2.0</text>
      <text x="138" y="444">3.0</text>
      <text x="138" y="534">4.0</text>
      <text x="138" y="624">5.0</text>
      <text x="138" y="714">6.0</text>
      <text x="138" y="804">7.0</text>
      <text x="138" y="849">7.5</text>
    </g>
    <!-- landmark names -->
    <g fill="#6a6a74" font-size="9.5">
      <text x="60" y="186">CROWN</text>
      <text x="60" y="256">CHIN</text>
      <text x="60" y="300">SHOULDER</text>
      <text x="60" y="354">CHEST</text>
      <text x="60" y="444">WAIST</text>
      <text x="60" y="517">MID · HIP/CROTCH</text>
      <text x="60" y="678">KNEE</text>
      <text x="60" y="826">ANKLE</text>
      <text x="60" y="858">SOLE</text>
    </g>
    <text x="60" y="170" font-size="9.5" fill="#6a6a74">HEAD UNITS</text>
  </g>

  <!-- ================= PANEL A — SILHOUETTE (cx=430) ================= -->
  <g>
    <text class="mono" x="430" y="900" font-size="11" letter-spacing="2" text-anchor="middle" fill="#1a1a22">A · SILHOUETTE</text>
    <text class="mono" x="430" y="918" font-size="9" letter-spacing="1" text-anchor="middle" fill="#6a6a74">read pose &amp; mass at a glance</text>
    <g fill="#15151c" stroke="#15151c" stroke-linecap="round" stroke-linejoin="round">
      <!-- legs (thigh sw44, calf sw30) -->
      <line x1="396" y1="520" x2="398" y2="674" stroke-width="44"/>
      <line x1="398" y1="674" x2="400" y2="822" stroke-width="30"/>
      <line x1="464" y1="520" x2="462" y2="674" stroke-width="44"/>
      <line x1="462" y1="674" x2="460" y2="822" stroke-width="30"/>
      <!-- feet -->
      <ellipse cx="392" cy="836" rx="28" ry="12"/>
      <ellipse cx="468" cy="836" rx="28" ry="12"/>
      <!-- torso -->
      <path d="M348 300 L384 440 L370 522 L490 522 L476 440 L512 300 Z"/>
      <!-- neck + head -->
      <rect x="415" y="258" width="30" height="46"/>
      <ellipse cx="430" cy="216" rx="37" ry="46"/>
      <!-- arms (sw26) -->
      <line x1="348" y1="306" x2="338" y2="440" stroke-width="26"/>
      <line x1="338" y1="440" x2="346" y2="560" stroke-width="26"/>
      <line x1="512" y1="306" x2="522" y2="440" stroke-width="26"/>
      <line x1="522" y1="440" x2="514" y2="560" stroke-width="26"/>
      <ellipse cx="346" cy="582" rx="15" ry="20"/>
      <ellipse cx="514" cy="582" rx="15" ry="20"/>
    </g>
  </g>

  <!-- ================= PANEL B — CONSTRUCTION BLOCKOUT (cx=790) ================= -->
  <g>
    <text class="mono" x="790" y="900" font-size="11" letter-spacing="2" text-anchor="middle" fill="#1a1a22">B · BLOCKOUT</text>
    <text class="mono" x="790" y="918" font-size="9" letter-spacing="1" text-anchor="middle" fill="#6a6a74">volumes · joints · centerline</text>
    <!-- centerline -->
    <line x1="790" y1="168" x2="790" y2="525" stroke="#c2bfb7" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- volume capsules (light grey) -->
    <g stroke="#d2cfc7" stroke-linecap="round" fill="none">
      <line x1="760" y1="520" x2="762" y2="674" stroke-width="40"/>
      <line x1="762" y1="674" x2="764" y2="820" stroke-width="26"/>
      <line x1="820" y1="520" x2="818" y2="674" stroke-width="40"/>
      <line x1="818" y1="674" x2="816" y2="820" stroke-width="26"/>
      <line x1="712" y1="306" x2="702" y2="440" stroke-width="22"/>
      <line x1="702" y1="440" x2="710" y2="560" stroke-width="22"/>
      <line x1="868" y1="306" x2="878" y2="440" stroke-width="22"/>
      <line x1="878" y1="440" x2="870" y2="560" stroke-width="22"/>
    </g>
    <!-- construction outlines -->
    <g stroke="#1a1a22" stroke-width="1.6" fill="none">
      <!-- head + brow + jaw -->
      <ellipse cx="790" cy="216" rx="37" ry="46"/>
      <line x1="753" y1="210" x2="827" y2="210"/>
      <path d="M765 248 Q790 268 815 248"/>
      <!-- two sealed sensor slits (form only) -->
      <line x1="762" y1="206" x2="784" y2="206" stroke-width="4"/>
      <line x1="796" y1="206" x2="818" y2="206" stroke-width="4"/>
      <!-- neck -->
      <rect x="775" y="258" width="30" height="46"/>
      <!-- ribcage egg -->
      <ellipse cx="790" cy="372" rx="58" ry="80"/>
      <!-- pelvis bucket -->
      <path d="M748 470 L832 470 L818 528 L762 528 Z"/>
      <!-- spine -->
      <line x1="790" y1="304" x2="790" y2="470"/>
    </g>
    <!-- joint dots -->
    <g fill="#1a1a22">
      <circle cx="712" cy="306" r="6"/><circle cx="868" cy="306" r="6"/>
      <circle cx="702" cy="440" r="5.5"/><circle cx="878" cy="440" r="5.5"/>
      <circle cx="710" cy="560" r="5"/><circle cx="870" cy="560" r="5"/>
      <circle cx="760" cy="520" r="6.5"/><circle cx="820" cy="520" r="6.5"/>
      <circle cx="762" cy="674" r="6"/><circle cx="818" cy="674" r="6"/>
      <circle cx="764" cy="820" r="5.5"/><circle cx="816" cy="820" r="5.5"/>
    </g>
    <!-- feet blocks -->
    <g stroke="#1a1a22" stroke-width="1.6" fill="none">
      <path d="M748 822 L786 822 L790 838 L744 838 Z"/>
      <path d="M832 822 L794 822 L790 838 L836 838 Z"/>
    </g>
  </g>

  <!-- ================= PANEL C — STICK / SKELETON (cx=1140) ================= -->
  <g>
    <text class="mono" x="1140" y="900" font-size="11" letter-spacing="2" text-anchor="middle" fill="#1a1a22">C · STICK POSE</text>
    <text class="mono" x="1140" y="918" font-size="9" letter-spacing="1" text-anchor="middle" fill="#6a6a74">balance line · skeleton</text>
    <!-- balance plumb line -->
    <line x1="1140" y1="170" x2="1140" y2="845" stroke="#c2bfb7" stroke-width="1" stroke-dasharray="3 5"/>
    <!-- skeleton -->
    <g stroke="#1a1a22" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="1140" cy="216" r="34"/>
      <line x1="1140" y1="250" x2="1140" y2="306"/>          <!-- neck -->
      <line x1="1062" y1="306" x2="1218" y2="306"/>          <!-- shoulder bar -->
      <line x1="1140" y1="306" x2="1140" y2="500"/>          <!-- spine -->
      <line x1="1078" y1="500" x2="1202" y2="500"/>          <!-- hip bar -->
      <!-- left arm -->
      <line x1="1062" y1="306" x2="1050" y2="440"/>
      <line x1="1050" y1="440" x2="1060" y2="560"/>
      <!-- right arm -->
      <line x1="1218" y1="306" x2="1230" y2="440"/>
      <line x1="1230" y1="440" x2="1220" y2="560"/>
      <!-- left leg -->
      <line x1="1078" y1="500" x2="1086" y2="674"/>
      <line x1="1086" y1="674" x2="1092" y2="822"/>
      <!-- right leg -->
      <line x1="1202" y1="500" x2="1194" y2="674"/>
      <line x1="1194" y1="674" x2="1188" y2="822"/>
      <!-- feet -->
      <line x1="1092" y1="822" x2="1116" y2="836"/>
      <line x1="1188" y1="822" x2="1164" y2="836"/>
    </g>
    <!-- joints -->
    <g fill="#1a1a22">
      <circle cx="1062" cy="306" r="5"/><circle cx="1218" cy="306" r="5"/>
      <circle cx="1050" cy="440" r="4.5"/><circle cx="1230" cy="440" r="4.5"/>
      <circle cx="1078" cy="500" r="5"/><circle cx="1202" cy="500" r="5"/>
      <circle cx="1086" cy="674" r="4.5"/><circle cx="1194" cy="674" r="4.5"/>
    </g>
  </g>

  <!-- ================= HELMET DETAIL INSET ================= -->
  <g>
    <rect x="1300" y="150" width="158" height="200" fill="#f4f2ee" stroke="#1a1a22" stroke-width="1.2"/>
    <text class="mono" x="1379" y="172" font-size="9.5" letter-spacing="1" text-anchor="middle" fill="#1a1a22">HELMET FORM</text>
    <!-- faceless planar helmet front (kitsune-geometry, monochrome) -->
    <g stroke="#1a1a22" stroke-width="1.4" fill="#e9e7e1">
      <path d="M1379 196 C1352 196 1338 214 1338 244 C1338 286 1360 316 1379 322 C1398 316 1420 286 1420 244 C1420 214 1406 196 1379 196 Z"/>
    </g>
    <!-- planar facet lines -->
    <g stroke="#8a8780" stroke-width="0.8" fill="none">
      <line x1="1379" y1="196" x2="1379" y2="322"/>
      <line x1="1352" y1="232" x2="1406" y2="232"/>
      <line x1="1346" y1="262" x2="1412" y2="262"/>
    </g>
    <!-- two sealed sensor slits (no eyes, no glow) -->
    <g fill="#1a1a22">
      <rect x="1352" y="247" width="20" height="5" rx="2.5"/>
      <rect x="1386" y="247" width="20" height="5" rx="2.5"/>
    </g>
    <text class="mono" x="1379" y="338" font-size="8" letter-spacing="0.5" text-anchor="middle" fill="#6a6a74">FACELESS · 2 SEALED SLITS · NO EYES</text>
  </g>

  <!-- ================= NOTES / FAIL-FIX LADDER ================= -->
  <g class="mono">
    <line x1="44" y1="936" x2="1456" y2="936" stroke="#1a1a22" stroke-width="0.6"/>
    <text x="44" y="956" font-size="9.5" letter-spacing="1" fill="#3a3a42">WORKING BLOCK: 7.5 HEADS · MID-LINE AT HIP/CROTCH · BROAD SHOULDER (~2 HEADS) · MILD TAPER  —  ALL PROPOSED / UNCONFIRMED vs MASTER CANON</text>
    <text x="44" y="972" font-size="9.5" letter-spacing="1" fill="#6a6a74">FAIL→FIX ONE LAYER: pose→fix STICK (C) · proportion→fix BLOCKOUT (B) · helmet→fix HELMET INSET · limb form→fix limb capsule.  NOT A RENDER · NOT CANON · NOT ASSET-LOCKED · NO COSTUME/COAT YET.</text>
  </g>
</svg>
