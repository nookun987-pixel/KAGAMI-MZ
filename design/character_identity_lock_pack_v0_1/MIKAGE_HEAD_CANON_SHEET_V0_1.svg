  <text x="44" y="84" font-size="10" fill="#6a6a74">Nguồn: MASK CANON ruling 06-02 (option c) trong ENTITY_PHASE_SPEC_V1 🔒 + V1.3 mask-only fix + anchor render A1 SHOT_02 (UNIFIED_KEY_VISUAL_V4, LOCKED).</text>
