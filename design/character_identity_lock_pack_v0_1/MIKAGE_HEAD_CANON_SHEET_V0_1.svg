  <!-- spec block -->
  <g font-size="10.5" fill="#1a1a22">
    <rect x="44" y="560" width="1112" height="380" fill="#f4f2ee" stroke="#1a1a22"/>
    <text x="68" y="590" font-size="12" letter-spacing="2">MASK CANON — KHÓA (ENTITY_PHASE_SPEC §2, ruling 06-02)</text>
    <line x1="68" y1="600" x2="1132" y2="600" stroke="#c9c6c0"/>
    <text x="68" y="626">1. CẤU TRÚC = planar geometry mặt nạ Kitsune B4C (silhouette nhận diện thương hiệu) — KHÔNG phải overlay đắp lên.</text>
    <text x="68" y="650">2. KHE MẮT = đúng 2 khe, 0.7", SEALED monocoque — rãnh khắc chìm phẳng, KHÔNG phải lỗ hở. Violet = tín hiệu PHÁT từ khe (Slit Halo), không phải ánh sáng lọt qua lỗ.</text>
    <text x="68" y="674">3. KHÔNG mắt người · KHÔNG miệng · KHÔNG mũi hở · KHÔNG da · KHÔNG tóc che mặt nạ phía trước.</text>
    <text x="68" y="698">4. TRUYỀN DẪN = Graphene matrix + Side-Channel BMF dưới lớp sứ (không cần lỗ quang học) — seal khe = quy phục chuẩn Clean Code của LORA.</text>
    <text x="68" y="722">5. BRAND ↔ FILM = MỘT identity hai độ tinh: brand mark 2 sensor slits CHÍNH LÀ 2 khe sealed của mask film.</text>
    <text x="68" y="742">6. MÕM (CHỐT 06-10, operator delegate): nhô 0.20 head-unit từ mặt phẳng má (side view), sống mõm ~30° so trục dọc mặt, wedge 3 mặt phẳng.</text>
    <text x="68" y="758">7. SAU GÁY = vị trí Ensō cơ khí (chỉ hiện P3 glow đỏ; reference trung tính không vẽ glow).</text>
    <line x1="68" y1="766" x2="1132" y2="766" stroke="#c9c6c0"/>
    <text x="68" y="790" font-size="11" letter-spacing="2">ANCHOR ẢNH THẬT (IP-Adapter ref)</text>
    <text x="68" y="812" font-size="9.5" fill="#444">A1 = SHOT_02 helmet (UNIFIED_KEY_VISUAL_V4, LOCKED, đã verify bằng mắt — 2 sealed slits + violet halo) → dùng làm head identity ref khi render.</text>
    <text x="68" y="830" font-size="9.5" fill="#444">Lỗi từng dính (drift đã ghi nhận): mark chữ nhật thừa ngoài 2 khe (PUBLIC_RENDER blocker cũ) · cheek lines thừa · khe bị vẽ thành lỗ sáng.</text>
    <line x1="68" y1="850" x2="1132" y2="850" stroke="#c9c6c0"/>
    <text x="68" y="872" font-size="9" fill="#6a6a74">CHUA_XAC_NHAN còn lại: bán kính bo cạnh · tỉ lệ khe/chiều rộng mặt (đo từ A1 khi canon stage). Muzzle depth ĐÃ CHỐT 06-10.</text>
    <text x="68" y="890" font-size="9" fill="#b03a2e">CANON_LOCK = NO · ASSET_LOCK = NO — sheet thuộc IDENTITY_LOCK_PACK_V0_1, chờ owner review (Case B của kế hoạch: nếu chưa đủ canon → review riêng sheet này).</text>
