allowed_actions:
  - build one new derivative blend containing all 3 lighting states (S0 DORMANT, S1 AWARE, S2 COMBAT), organized as separate scenes or frame ranges or light-state variants, Codex chooses and reports the approach
  - apply the shared 6-layer lighting/material/camera/grade base identically across all 3 states (angled key plus low fill plus negative fill plus cool rim, volumetric haze, porcelain SSS/roughness-variation/clearcoat, cloak sheen/fresnel, 85mm shallow DOF camera focused on the slits with void at least 70 percent of frame, AgX or Filmic grade with crushed blacks and an isolated violet band)
  - set slit emission (#8F00FF) near-off/low-ember at S0, and full/near-clip strongly saturated at S1 and S2, allowing a soft violet bounce onto the porcelain cheeks at S1 and S2 only
  - keep halo emission at passive matte level at S0 and S1, and raise the halo material's own emission strength only at S2 so it visibly glows white, plus selective bloom on the halo at S2 in the grade step
  - render 3 separate short clips, one per state, sharing the same camera angle and framing so they can be cut together later
  - name the 3 clips exactly MIKAGE_CINEMATIC_LIGHTING_PASS_V0_1_S0_DORMANT.mp4, _S1_AWARE.mp4, _S2_COMBAT.mp4
  - render a contact sheet with at least 3 frames, one representative frame per state at the same camera angle, clearly labeled by state
  - sample halo pixel color at 4 or more points per frame across all 3 states and report the numeric RGB/hex values, and report slit and halo emission strength values separately per state
  - write full findings into the proof and gate report, with each state's numbers reported separately
  - write the real deliverables into the paths listed under real_deliverables
  - run deterministic verification appropriate to this task type
  - clean .blend1 backups
  - commit local changes only

forbidden_actions:
  - do not change geometry, rig, bones, or topology of the character in any way
  - do not change canon base colors (helmet stays #F2EEEA, cloak stays void black, slit hue stays #8F00FF)
  - do not let violet touch, bounce onto, or tint the halo under any circumstance or at any state, including physically based bounce/GI/rim/glow/bloom
  - do not let the halo glow at S0 or S1, and do not leave the halo without glow at S2 - the state order is a hard requirement
  - do not wash violet across the whole scene or use violet as a key or fill light, at any state
  - do not use teal-orange or any grade direction other than cool-mono plus a separated violet band
  - do not animate the blade, add new mesh or bones, or add an environment/set in this task
  - do not use anime, cel-shading, speed-line, or neon-HUD styling at any state
  - do not cut, edit, add captions, add a cover-card, or export a final short - deliverables are the 3 raw state clips only, that work belongs to a separate later pipeline step
  - do not do any final/marketing render or claim production-ready/canon-lock/final status
  - do not push
  - do not modify unrelated files
  - do not leave any .blend1 backup
  - do not place any file other than contact_sheet.png and contact_sheet_review_report.md in the gate folder

pass_conditions:
  - geometry/rig/topology unchanged from source
  - halo pixel-sampled at 4 or more points per frame across all 3 states shows no violet drift, reported numerically
  - state machine reads correctly: S0 has dim/near-off slits and a matte halo, S1 has full violet slits and a still-matte halo, S2 has full violet slits and a visibly glowing white halo, in clearly ascending intensity order
  - violet appears only at the slits, soft cheek bounce at S1/S2, and optionally background bokeh
  - directional lighting with a working rim separates the cloak from the void in all 3 states
  - porcelain reads subsurface/roughness-variation rather than plastic, consistent across states
  - grade is cool-mono plus separated violet, not teal-orange, consistent across states
  - void occupies at least 70 percent of frame in all 3 states, no anime/cel/neon-HUD styling
  - the 3 clips are named with the exact S0_DORMANT/S1_AWARE/S2_COMBAT suffixes and share the same camera framing
  - gate folder holds ONLY contact_sheet.png (at least 3 labeled frames, one per state) and contact_sheet_review_report.md and python .mikage/tools/verify_output.py prints PASS
  - no .blend1 remains

stop_conditions:
  - any violet pixel is detected on the halo at any sampled point, frame, or state
  - the halo glows at S0 or S1, or fails to glow at S2
  - slits are not correctly dim at S0 or not correctly full at S1/S2
  - violet is used as key or fill light or washed across the environment at any state
  - geometry/rig/topology changes outside lighting/material/camera/grade
  - canon base color (helmet/cloak/slit hue) drifts from the locked values
  - anime/cel-shading/speed-line/neon-HUD styling appears at any state
  - validator or verification command cannot run, or the gate folder contains files other than the two allowed
  - halo violet-bounce cannot be avoided through normal light-rig/material adjustment (report and stop, this is an operator canon decision)

