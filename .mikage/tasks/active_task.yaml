allowed_actions:
  - open MIKAGE_PRODUCTION_RIG_LOOKDEV_INTEGRATION_V0_1.blend read-only (in memory) to inspect visible mesh topology and the existing armature's bone positions
  - list every visible, render-enabled mesh (excluding the 29 legacy meshes already audited), its world-space bounding box, and a shape description (continuous single volume vs separate distinct parts)
  - determine whether the body/cloak is one continuous mesh volume or has separate limb parts, and report this explicitly
  - report world-space head/tail position and bounding box for every one of the 23 bones in MIKAGE_initial_armature_scaffold
  - for each functionally-corresponding bone/mesh pair, report the spatial offset/mismatch between them
  - provide a reasoned estimate of how many bones and roughly where they would need to be for the current visible geometry (estimate only, not a decision)
  - report blade and halo world-space position/size to help determine correct future attachment points
  - write the full audit answers into docs/reports/MIKAGE_MESH_TOPOLOGY_AUDIT_V0_1.md
  - use an existing image for the gate's contact_sheet.png if no new render is needed - do not render anything new
  - write contact_sheet_review_report.md summarizing the audit findings for the gate
  - clean any .blend1 that Blender creates while opening the file for inspection
  - commit local changes only (new report file only - no blend changes)

forbidden_actions:
  - do not create, delete, or modify any object, mesh, armature, bone, vertex group, or material in the audited blend
  - do not pose or render anything new
  - do not save the audited blend under any name
  - do not begin any bone-reposition or new-armature-build work in this task - audit and report only
  - do not push
  - do not modify unrelated files
  - do not leave any .blend1 backup
  - do not place any file other than contact_sheet.png and contact_sheet_review_report.md in the gate folder

pass_conditions:
  - the audited blend is byte-identical before and after (MESH_AUDIT_FILE_MODIFIED = NO)
  - all 7 audit questions in the brief are answered with specifics (names, dimensions, positions) in docs/reports/MIKAGE_MESH_TOPOLOGY_AUDIT_V0_1.md
  - gate folder holds ONLY contact_sheet.png + contact_sheet_review_report.md and python .mikage/tools/verify_output.py prints PASS
  - no .blend1 remains

stop_conditions:
  - the audited blend cannot be opened/read (report BLOCKER = FILE_UNREADABLE with details)
  - the audited blend was modified in any way (report BLOCKER = MESH_AUDIT_FILE_MODIFIED)
  - validator or verification command cannot run (report BLOCKER = VALIDATOR_SCHEMA_MISMATCH)
  - .blend1 backup remains after cleanup

verify_command: python .mikage\tools\verify_output.py
next_step_if_pass: Lane B reads the topology audit and, together with the operator, decides whether to reposition the existing 23 bones or build a new armature fitted to the current mesh, then drafts that task from real data.
next_step_if_fail: stop and report BLOCKER reason only. Do not open a new scope.
