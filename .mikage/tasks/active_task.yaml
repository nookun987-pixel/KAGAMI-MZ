allowed_actions:
  - add at most 2 new bones as children of root, used only as secondary cloth-sway helpers for the lower cloak hem, with neutral names (not limb-named/shaped/positioned)
  - animate root translating forward a short distance (~1-2m) with a subtle vertical bob and slight alternating side lean/weight-shift
  - animate the 2 hem-sway bones oscillating for secondary cloth motion at the lower cloak
  - render a short test clip and keyframe contact sheet showing the cloak swaying/gliding without any gap implying legs
  - write full findings (new bone names/positions/purpose, motion description, void-body-mass-intact confirmation, halo/slit color checks) into the proof and gate report
  - write the real deliverables into the paths listed under real_deliverables
  - run deterministic verification (cloak remains one closed volume at every sampled frame, no new limb-shaped geometry, halo/slit colors correct, blade unanimated)
  - clean .blend1 backups
  - commit local changes only

forbidden_actions:
  - do not create any mesh of any kind, especially nothing limb-shaped (arm, leg, hand, foot)
  - do not name, shape, or position any new bone like a limb (arm/leg/hand/foot/thigh/shin/knee/elbow/shoulder)
  - do not let the cloak show any gap or split at the hem that implies legs underneath, at any frame
  - do not change the cloak's base geometry/silhouette - only add deformation via the new bones
  - do not change slit hue or halo color - both stay locked (#8F00FF slits, white halo)
  - do not animate the blade independently - it stays rigid to root
  - do not do any final/marketing render or claim a finished walk cycle/production-ready/canon-lock status
  - do not push
  - do not modify unrelated files
  - do not leave any .blend1 backup
  - do not place the .mp4 or any file other than contact_sheet.png and contact_sheet_review_report.md in the gate folder

pass_conditions:
  - at most 2 new bones added, none limb-named/shaped/positioned
  - the cloak remains a single closed volume at every sampled frame (no gap/split implying legs)
  - root translates forward with a bob/lean-only robe-glide motion; hem-sway bones add secondary cloth motion
  - halo remains white; slit hue remains #8F00FF
  - blade remains unanimated and rigid to root
  - gate folder holds ONLY contact_sheet.png + contact_sheet_review_report.md (mp4 stays outside) and python .mikage/tools/verify_output.py prints PASS
  - no .blend1 remains

stop_conditions:
  - the cloak shows any gap or split implying legs underneath at any frame (report BLOCKER = VOID_BODY_MASS_VIOLATION)
  - any limb-shaped mesh or limb-named/positioned bone is created (report BLOCKER = LIMB_GEOMETRY_VIOLATION)
  - the halo or slit color changes (report BLOCKER = HALO_COLOR_VIOLATION or BLOCKER = SLIT_HUE_FAIL as applicable)
  - the blade is animated independently of root (report BLOCKER = SCOPE_VIOLATION)
  - validator or verification command cannot run, or the mp4 ends up inside the gate folder (report BLOCKER = VALIDATOR_SCHEMA_MISMATCH)
  - .blend1 backup remains after cleanup
  - if convincing locomotion seems to require showing legs, STOP and report rather than resolving unilaterally - this is a canon decision for the operator

