allowed_actions:
  - build the ComfyUI node stack: Flux.1-dev base (img2img) plus Depth ControlNet plus Canny/Line ControlNet plus Redux, feeding into sampler then VAE
  - export a Depth AOV (Z or mist pass) directly from the source blend at the same camera and frame used for the S2 still, for use as the Depth ControlNet input
  - derive a Canny/Line map directly from the S2 still image for use as the second ControlNet input, to hold the slit, halo, and cloak edges
  - use the master character reference sheet as the Redux input to anchor identity
  - run multiple seeds across denoise levels 0.45, 0.55, and 0.65, holding seed fixed while comparing denoise levels
  - set ControlNet strengths in the ranges given (canny 0.8 to 1.0, depth 0.5 to 0.7, redux weight 0.4 to 0.6), guidance around 3.5, steps 24 to 30
  - use the exact positive and negative prompt text supplied in the reference brief
  - self-screen every generated candidate against the canon gate before including it in the contact sheet, discarding any that fail
  - select exactly one recommended candidate that clears the canon gate and reads the most cinematic
  - sample the chosen candidate's halo color at 4 or more points and report numeric values
  - record the exact seed, denoise, ControlNet strengths, guidance, and steps used for the chosen candidate
  - write the real deliverables into the paths listed under real_deliverables
  - run deterministic verification appropriate to this task type

