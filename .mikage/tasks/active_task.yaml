# Dispatched by operator (BOOS) 2026-07-03 #30, via Lane B (Cowork) coordination.
# Governed by AGENTS.md Thirty-eighth controlled exception (MIKAGE_PRODUCTION_RIG_BIND_V0_1 = OPEN).
# Armature audit (exception #37, PASS) found the existing armature MIKAGE_initial_armature_scaffold
# (23 bones) is bound only to 29 hidden legacy blockout meshes - the VISIBLE current production
# geometry (helmet/cloak/blade/halo) has zero armature/parent binding at all. This task performs the
# first real bind of the visible mesh to the existing skeleton: soft deformation for flexible body/
# cloak mesh, rigid parent-only for hard accessories (helmet/blade/halo). No new bones, no geometry
# change, no material change - binding only.

