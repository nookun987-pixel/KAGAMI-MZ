allowed_actions:
  - create a NEW Armature object named MIKAGE_axial_rig_v0_1 (do not reuse the old armature's name)
  - build exactly 7 bones (root, pelvis, spine_01, spine_02, chest, neck, head) positioned per the real coordinates in the topology audit (docs/reports/MIKAGE_MESH_TOPOLOGY_AUDIT_V0_1.md section 5), with head centered on the actual helmet bounding box from section 1/6 of that audit
  - bind MASTER_MATCH_single_closed_draped_void_cloak to the new armature with soft, blended vertex-group weights across the root/pelvis/spine_01/spine_02/chest/neck transitions
  - rigidly attach (single weight=1.0 group or Child-Of constraint) the helmet, both sensor-slit blocks, and the halo ring to the head bone, preserving the halo's white material
  - rigidly attach the three blade slab meshes to root or pelvis (choose based on the real world-space position data in the audit, report the choice and reasoning) - not to a hand, since no hand mesh exists
  - run one light test pose (10-15 degrees on chest or spine_02) to confirm the cloak deforms smoothly without tearing, and that helmet/halo/blade move correctly with their bone
  - render a simple 2-view contact sheet (neutral + light test pose) demonstrating the binding works
  - write full binding details, bone positions achieved, test results, and hash comparisons into the proof and gate report
  - write the real deliverables (new derivative blend, contact sheet, proof) into the paths listed under real_deliverables
  - run deterministic verification (geometry/material of all visible meshes unchanged except added binding data, halo color check, old armature and 29 legacy meshes untouched)
  - clean .blend1 backups
  - commit local changes only

forbidden_actions:
  - do not use, modify, or delete the old armature MIKAGE_initial_armature_scaffold or any of its 29 bound legacy meshes
  - do not create any of the 16 limb bones (clavicle/upper_arm/forearm/hand/thigh/shin/foot/toe, either side) - the topology audit confirmed no corresponding mesh exists
  - do not change the geometry, silhouette, or proportions of any visible mesh
  - do not change any material or color, including the halo (must remain white) or the two slit emission materials (must remain violet)
  - do not perform the full 8-pose Stage B deformation test in this task - only a single light test pose
  - do not do any final/marketing render
  - do not claim canon lock, asset lock, or production-rig-ready (label CANDIDATE / NOT CANON-LOCKED)
  - do not push
  - do not modify unrelated files
  - do not leave any .blend1 backup
  - do not place any file other than contact_sheet.png and contact_sheet_review_report.md in the gate folder

pass_conditions:
  - new armature MIKAGE_axial_rig_v0_1 exists with exactly 7 bones, positioned per the audit's real coordinates
  - the old armature and its 29 legacy meshes are completely untouched
  - cloak mesh shows genuine blended multi-bone weights across the axial chain
  - helmet, slits, and halo move correctly and rigidly with the head bone; halo remains white
  - blade meshes move correctly and rigidly with root or pelvis, with the choice and reasoning reported
  - geometry, silhouette, and materials of all visible meshes are unchanged except for added binding data
  - light test pose (10-15 degrees) shows no severe tearing/clipping
  - gate folder holds ONLY contact_sheet.png + contact_sheet_review_report.md and python .mikage/tools/verify_output.py prints PASS
  - no .blend1 remains

stop_conditions:
  - geometry or material changes beyond binding are required (report BLOCKER = REBUILD_SIDE_EFFECT_DRIFT)
  - the light test pose still shows severe tearing/clipping unresolved within binding-only scope (report BLOCKER = REBUILD_BIND_INSUFFICIENT, do not expand into mesh/geometry edits)
  - the halo changes color (report BLOCKER = HALO_COLOR_VIOLATION)
  - the old armature or any of its 29 legacy meshes is touched in any way (report BLOCKER = LEGACY_TOUCHED)
  - validator or verification command cannot run (report BLOCKER = VALIDATOR_SCHEMA_MISMATCH)
  - .blend1 backup remains after cleanup

verify_command: python .mikage\tools\verify_output.py
next_step_if_pass: Lane B reviews the rebuild proof; if approved, Lane B drafts the real Stage B task (full 8-pose deformation contact sheet) on MIKAGE_PRODUCTION_RIG_REBUILD_V0_1.blend.
