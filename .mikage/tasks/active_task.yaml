# Dispatched by operator (BOOS) 2026-07-03 #33, via Lane B (Cowork) coordination.
# Governed by AGENTS.md Forty-first controlled exception (MIKAGE_STAGE_B_AXIAL_DEFORMATION_V0_1 = OPEN).
# Rebuild #40 (PASS) produced a 7-bone axial-only rig (no limb bones - mesh has no separate arm/leg
# geometry per audit #39). Roadmap Stage B's original 8-pose list needs arms/legs (arms raised, left
# step, right step) which are physically impossible on this rig. This task scopes Stage B DOWN to 6
# poses achievable purely with the 7 axial bones, to sanity-check deformation before any locomotion/
# limb work is even considered.

