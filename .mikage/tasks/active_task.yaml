allowed_actions:
  - extend the exception #43 proof derivative (MIKAGE_STAGE_E_EXIT1_CINEMATIC_PROOF_V0_1.blend) into a new derivative, keeping the same choreography (dormant to ignite to awakened to cut-to-black), same camera framing/angle, same axial performance
  - raise render resolution to at least 1920x1080, 16:9 aspect, same framing/angle as the proof (upres only, no recrop)
  - raise render quality (samples/anti-aliasing/denoise) without changing approved lighting/materials/colors
  - make a minor duration adjustment (a second or two of breathing room) only if the choreography order stays intact, and report the actual final numbers
  - render the clip and a keyframe contact sheet at the new resolution
  - write full findings (resolution/fps/duration via ffprobe, choreography order confirmation, color checks, confirmation both original source files unchanged) into the proof and gate report
  - write the real deliverables into the paths listed under real_deliverables
  - run deterministic verification (both original source file hashes unchanged, no violet in environment, halo/slit colors correct, no new bones/mesh, no locomotion, blade unanimated)
  - clean .blend1 backups
  - commit local changes only

forbidden_actions:
  - do not modify either original source file (character or environment)
  - do not rebuild the combined scene from scratch - extend the exception #43 derivative
  - do not switch aspect ratio to vertical/9:16/Canvas format - stay 16:9 landscape
  - do not add any audio track
  - do not create any new bone (limb or otherwise) or any new mesh
  - do not attempt any walk/locomotion/stepping motion
  - do not animate the blade separately from its existing rigid root attachment
  - do not change slit hue - only emission strength may animate, hue stays #8F00FF
  - do not change the halo's color at any frame - must stay white and unanimated
  - do not introduce violet anywhere in the environment's materials or lighting
  - do not do any final/marketing render or claim production-ready/canon-lock/asset-lock status
  - do not push
  - do not modify unrelated files
  - do not leave any .blend1 backup
  - do not place the .mp4 or any file other than contact_sheet.png and contact_sheet_review_report.md in the gate folder

pass_conditions:
  - ffprobe confirms resolution >= 1920x1080, 16:9 aspect ratio, no audio stream
  - both original source files (character, environment) are hash-unchanged
  - slit hue remains #8F00FF at every sampled frame; halo remains white and unanimated
  - no violet appears anywhere in the environment
  - no new bones/mesh created; no locomotion attempted; blade remains unanimated/rigid-to-root
  - choreography order preserved (dormant, ignite, awakened, cut-to-black)
  - gate folder holds ONLY contact_sheet.png + contact_sheet_review_report.md (mp4 stays outside) and python .mikage/tools/verify_output.py prints PASS
  - no .blend1 remains

stop_conditions:
  - either original source file is modified in any way (report BLOCKER = SOURCE_FILE_MODIFIED)
  - slit hue drifts from #8F00FF or reads magenta (report BLOCKER = SLIT_HUE_FAIL)
  - the halo changes color at any frame (report BLOCKER = HALO_COLOR_VIOLATION)
  - violet appears anywhere in the environment (report BLOCKER = VIOLET_IN_ENVIRONMENT)
  - any new bone/mesh is created, locomotion is attempted, or the blade is animated independently (report BLOCKER = SCOPE_VIOLATION)
  - aspect ratio is switched to vertical or an audio track is added (report BLOCKER = SPEC_DEVIATION)
  - validator or verification command cannot run, or the mp4 ends up inside the gate folder (report BLOCKER = VALIDATOR_SCHEMA_MISMATCH)
  - .blend1 backup remains after cleanup

verify_command: python .mikage\tools\verify_output.py
next_step_if_pass: Lane B and operator review the cinematic together to decide whether it serves as the main candidate for publishing, needs a further polish round (color grade, audio), or whether Exit 2 (full locomotion) is still wanted later.
next_step_if_fail: stop and report BLOCKER reason only. Do not open a new scope.
