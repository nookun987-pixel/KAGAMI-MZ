pass_conditions:
  - geometry/rig/topology unchanged from source
  - halo pixel-sampled at 4 or more points per frame shows no violet drift, reported numerically
  - at least one AFTER frame/angle clearly shows the wow-target together: slits reading strongly saturated/near-full violet AND the halo visibly glowing/blooming white
  - violet appears only at the slits, soft cheek bounce, and optionally background bokeh
  - directional lighting with a working rim separates the cloak from the void
  - porcelain reads subsurface/roughness-variation rather than plastic
  - grade is cool-mono plus separated violet, not teal-orange
  - contact sheet includes BEFORE and AFTER pairs at the same angle for direct comparison
  - gate folder holds ONLY contact_sheet.png and contact_sheet_review_report.md and python .mikage/tools/verify_output.py prints PASS
  - no .blend1 remains

