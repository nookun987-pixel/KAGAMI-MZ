real_deliverables:
  - production/character/production_actor/rig_derivatives/MIKAGE_STAGE_B_AXIAL_DEFORMATION_V0_1.blend
  - production/character/reviews/MIKAGE_STAGE_B_AXIAL_DEFORMATION_V0_1_CONTACT_SHEET.png
  - production/character/reviews/MIKAGE_STAGE_B_AXIAL_DEFORMATION_V0_1_PROOF.md

allowed_actions:
  - open MIKAGE_PRODUCTION_RIG_REBUILD_V0_1.blend and save a new derivative under the real_deliverables blend path
  - pose the 7 existing bones of MIKAGE_axial_rig_v0_1 only (root, pelvis, spine_01, spine_02, chest, neck, head) - no new bones, no bone repositioning
  - create exactly 6 poses - neutral, quarter_turn, forward_bend, side_pose, head_turn, backward_lean - each using only rotations on the existing axial bones as described in the brief
  - render a contact sheet showing all 6 poses clearly labeled
  - write full per-pose findings (tearing/clipping presence and location, helmet/halo/blade attachment integrity, halo color sample, slit color sample) into the proof and gate report
  - write the real deliverables into the paths listed under real_deliverables
  - run deterministic verification (geometry/material hashes unchanged outside pose data, bone count of new rig still 7, old armature and 29 legacy meshes untouched)
  - clean .blend1 backups
  - commit local changes only

forbidden_actions:
  - do not create any new bone (limb or otherwise) on MIKAGE_axial_rig_v0_1
  - do not reposition, add, or remove any of the 7 existing bones
  - do not attempt arms_raised, left_step, right_step, or a hand-gripped blade_hold pose - no bone/mesh exists for these; if this seems to require new geometry, stop and report instead of improvising
  - do not use, modify, or delete the old armature MIKAGE_initial_armature_scaffold or any of its 29 bound legacy meshes
  - do not change the geometry, silhouette, or proportions of any visible mesh
  - do not change any material or color, including the halo (must remain white at every pose) or the two slit emission materials (must remain violet near #8F00FF at every pose)
  - do not perform any final/marketing render
  - do not claim canon lock, asset lock, or production-rig-ready (label CANDIDATE / NOT CANON-LOCKED)
  - do not push
  - do not modify unrelated files
  - do not leave any .blend1 backup
  - do not place any file other than contact_sheet.png and contact_sheet_review_report.md in the gate folder

pass_conditions:
  - all 6 poses (neutral, quarter_turn, forward_bend, side_pose, head_turn, backward_lean) are rendered and each is individually reported PASS or FAIL
  - no severe tearing/clipping at any pose, or any such issue is clearly flagged with its location rather than silently ignored
  - helmet, halo, and blade remain rigidly attached to their parent bone (head for helmet/halo, root for blade) at every pose with no visible separation or drift
  - halo renders white and slit color samples near #8F00FF at every pose
  - new rig MIKAGE_axial_rig_v0_1 still has exactly 7 bones, unchanged positions
  - old armature and its 29 legacy meshes are completely untouched
  - geometry and materials of all visible meshes are unchanged outside pose/keyframe data
  - gate folder holds ONLY contact_sheet.png + contact_sheet_review_report.md and python .mikage/tools/verify_output.py prints PASS
  - no .blend1 remains

stop_conditions:
  - one or more poses show severe tearing/clipping that cannot be resolved within pose/weight-only scope (report BLOCKER = STAGE_B_DEFORMATION_FAIL, name the pose and region, do not alter geometry to compensate)
  - helmet, halo, or blade separates or drifts from its parent bone at any pose (report BLOCKER = RIGID_ATTACH_FAIL)
  - the halo changes color (report BLOCKER = HALO_COLOR_VIOLATION)
  - the old armature or any of its 29 legacy meshes is touched, or the new rig's bone count/positions change (report BLOCKER = SCOPE_VIOLATION)
  - validator or verification command cannot run (report BLOCKER = VALIDATOR_SCHEMA_MISMATCH)
  - .blend1 backup remains after cleanup

verify_command: python .mikage\tools\verify_output.py
next_step_if_pass: Lane B reviews the proof; operator decides whether to open a future limb-bone/mesh task (for the full 8-pose roadmap Stage B) or proceed to Exit 1/Exit 2 of the Lane A Roadmap constrained to axial-only motion.
next_step_if_fail: stop and report BLOCKER reason only. Do not open a new scope.
