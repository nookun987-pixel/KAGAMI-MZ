  - animate the two slit emission materials' STRENGTH only (dormant ~2% of peak, fast ignite around 60-75% of the clip, hold awakened) - hue stays locked #8F00FF
  - animate a subtle rotation on neck/head and optionally chest/spine_02 for a small head-tilt/weight-shift (smaller magnitude than the Gate B test poses)
  - animate the camera with a slow push-in along the hallway axis from the confirmed camera position, ending at a reasonable closer position chosen and reported by Codex
  - add a simple cut-to-black fade at the end of the clip
  - choose and report a reasonable resolution, fps, and duration for this proof shot (not required to match the Spotify Canvas spec)
  - render the clip and a keyframe contact sheet
  - write full findings (slit strength curve description, camera start/end position and duration, pose angles used, halo/slit color checks, confirmation both source files unchanged) into the proof and gate report
  - write the real deliverables into the paths listed under real_deliverables
  - run deterministic verification (both source file hashes unchanged, no new bones/mesh, no violet in environment, ffprobe-confirmed technical spec)
  - clean .blend1 backups
  - commit local changes only

forbidden_actions:
  - do not modify either source file (character or environment) - work only in a new derivative
  - do not create any new bone (limb or otherwise) on the character rig, or any new mesh
  - do not attempt any walk/locomotion/stepping motion - this is EXIT 1, no locomotion at all
  - do not move, re-parent, or animate the blade separately from its existing rigid root attachment
  - do not change slit hue - only emission strength may animate, hue stays #8F00FF
  - do not change the halo's color at any frame - must stay white throughout
  - do not introduce violet anywhere in the environment's materials or lighting
  - do not apply or assume the Spotify Canvas spec (1080x1920 loop) - this is an unrelated proof shot, not a Canvas deliverable
  - do not do any final/marketing render or claim production-ready/canon-lock/asset-lock status
  - do not push
  - do not modify unrelated files
  - do not leave any .blend1 backup
  - do not place the .mp4 or any file other than contact_sheet.png and contact_sheet_review_report.md in the gate folder

pass_conditions:
  - both source files (character, environment) are hash-unchanged
  - slit hue remains #8F00FF at every sampled frame; only emission strength animates per a dormant-to-ignite-to-awakened curve
  - halo remains white at every sampled frame
  - no violet appears anywhere in the environment
  - no new bones or mesh were created; no locomotion/walk was attempted
  - camera push-in and a cut-to-black fade are both present and read smoothly
  - ffprobe confirms the resolution/fps/duration Codex reports
  - gate folder holds ONLY contact_sheet.png + contact_sheet_review_report.md (mp4 stays outside the gate folder) and python .mikage/tools/verify_output.py prints PASS
  - no .blend1 remains

