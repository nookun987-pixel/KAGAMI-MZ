allowed_actions:
  - create a new derivative blend using MIKAGE_STANDING_HERO_POLISH_V0_14.blend as the geometry source (do not overwrite V0.14)
  - report BASE_SELECTED (both source files) and BODY_HASH_BEFORE/AFTER for V0.14 (must be identical - no geometry edit)
  - apply the approved V0.8.1 material set (porcelain shell, graphite underlayer, blade material, two slit emission materials) onto the V0.14 geometry, node-for-node as approved, with no re-tuning of the material recipe
  - report which V0.8.1 materials were applied to which V0.14 objects/slots
  - if any V0.8.1 material cannot be transplanted due to a technical incompatibility (different topology, missing slot, different node names), keep the corresponding V0.14 material unchanged for that part and FLAG it explicitly in the proof rather than inventing new material
  - report SLIT_HUE_PIXEL_SAMPLE and HALO_COLOR_CHECK on the front view and the helmet close-up view
  - render a 4-panel contact sheet (front, three-quarter, strict side, helmet close-up), 3600x900, matching the existing V0.14/turnaround framing conventions, with the integrated material
  - write the two verify artifacts into the gate folder - contact_sheet.png and contact_sheet_review_report.md; the gate folder must contain ONLY these two files
  - write the real deliverables (derivative blend, contact sheet PNG, proof) into the paths listed under real_deliverables
  - run deterministic verification (Blender reopen, geometry + transform + pose + camera + blade-position + halo-geometry hashes unchanged vs V0.14, pixel sample on rendered output for both slit hue and halo color)
  - clean .blend1 backups
  - commit local changes only

forbidden_actions:
  - do not change ANY geometry, pose, camera angle, blade position, or halo geometry - BODY_HASH must be UNCHANGED versus V0.14
  - do not move, rotate, or scale any object, camera, or light
  - do not re-tune or re-author the V0.8.1 material recipe - apply it as already approved
  - do not modify or overwrite the V0.14 or V0.8.1 source blends or their renders
  - do not invent a new material for any part where V0.8.1 has no equivalent - flag it instead
  - do not fix any mesh or lighting issue unrelated to this material-integration task - if spotted, FLAG it in the proof only
  - do not add text, lyrics, logo, or watermark
  - do not use warm colors, neon fill, full-screen violet wash, anime styling, human face or skin, or fake UI
  - do not put violet anywhere except the two slits
  - do not render the halo ring as anything other than white (per HALO_RING_RULING_2026-07-03)
  - do not raise global scene exposure
  - do not claim canon lock, asset lock, final pass, production ready, or verified (label CANDIDATE / NOT CANON-LOCKED)
  - do not push
  - do not modify unrelated files
  - do not leave any .blend1 backup
  - do not place any file other than contact_sheet.png and contact_sheet_review_report.md in the gate folder

pass_conditions:
  - new derivative blend reopens cleanly; both V0.14 and V0.8.1 source blends are byte-identical / unmodified
  - BODY_HASH, all object transforms, pose, camera, blade position, and halo geometry are UNCHANGED versus V0.14
  - SLIT_HUE_PIXEL_SAMPLE on the front view and helmet close-up reads violet near #8F00FF (target blue-dominant #9D0CEB/#9203E9 per V0.8.1 approval), not magenta, on the actual rendered pixels
  - VIOLET_OUTSIDE_TWO_SLITS = NO
  - HALO_COLOR_CHECK = WHITE on both views
  - blade renders intact and attached, not detached or missing
  - contact sheet + proof written to the real_deliverables paths; output remains CANDIDATE only
  - gate folder holds ONLY contact_sheet.png + contact_sheet_review_report.md and python .mikage/tools/verify_output.py prints PASS

stop_conditions:
  - geometry, pose, camera, blade position, or halo geometry would have to change to complete the task (report BLOCKER = INTEGRATION_GEOMETRY_DRIFT)
  - the slits still read magenta or violet spills outside the slits after integration (report BLOCKER = SLIT_HUE_FAIL)
  - the halo renders as anything other than white (report BLOCKER = HALO_COLOR_VIOLATION)
  - the V0.8.1 material cannot be technically transplanted onto V0.14 geometry (report BLOCKER = MATERIAL_TRANSPLANT_INCOMPATIBLE, with details)
  - validator or verification command cannot run (report BLOCKER = VALIDATOR_SCHEMA_MISMATCH)
  - .blend1 backup remains after cleanup

verify_command: python .mikage\tools\verify_output.py
next_step_if_pass: Lane B drift-check (hashes unchanged? hue + halo clean on actual pixels? no drift?) plus operator review; if approved, this becomes the unified production rig for Stage B (deformation test).
next_step_if_fail: stop and report BLOCKER reason only (V0.14 and V0.8.1 stay untouched; e.g. INTEGRATION_GEOMETRY_DRIFT / SLIT_HUE_FAIL / HALO_COLOR_VIOLATION / MATERIAL_TRANSPLANT_INCOMPATIBLE / VALIDATOR_SCHEMA_MISMATCH). Do not open a new scope.
