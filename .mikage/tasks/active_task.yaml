allowed_actions:
  - create a new standalone environment blend file under production/environment/sets/ containing a simple, dark, elongated corridor (walls/floor/optional ceiling) with perspective convergence, tonal void-black/graphite materials, and a minimal cold key light plus optional rim/fill
  - reference (read-only, in a separate working scene) the character file solely to check scale and framing - no modification of the character file
  - render exactly two static views: empty corridor, and corridor with the character placed at a marked position, same camera, no animation
  - write full findings (set geometry description, materials/colors used, confirmation of no violet anywhere, character scale/framing assessment) into the proof and gate report
  - write the real deliverables into the paths listed under real_deliverables
  - run deterministic verification (character reference file hash unchanged, no violet in environment materials/lighting, set is standalone)
  - clean .blend1 backups
  - commit local changes only

forbidden_actions:
  - do not modify the character reference file MIKAGE_PRODUCTION_RIG_REBUILD_V0_1.blend in any way
  - do not use violet (or any color near #8F00FF/#7B2FFF) anywhere in the environment's materials or lighting
  - do not use neon, colored wash, cyberpunk lighting, gaming-HUD elements, or clutter in the environment
  - do not animate anything - no camera push-in, no slit-ignite animation, no character motion (that is a separate future Exit 1 task)
  - do not make the environment set dependent on the character file to open/render standalone
  - do not do any final/marketing render
  - do not claim canon-lock, asset-lock, production-ready, or canon-location status (label CANDIDATE / NOT CANON-LOCKED)
  - do not push
  - do not modify unrelated files
  - do not leave any .blend1 backup
  - do not place any file other than contact_sheet.png and contact_sheet_review_report.md in the gate folder

pass_conditions:
  - a standalone environment blend file exists under production/environment/sets/ with a simple dark corridor set
  - no violet appears anywhere in the environment's materials or lighting
  - the character reference file hash is unchanged
  - two static views (empty corridor, corridor with character) are rendered and show plausible character scale and framing
  - the environment set can stand alone without the character file present
  - gate folder holds ONLY contact_sheet.png + contact_sheet_review_report.md and python .mikage/tools/verify_output.py prints PASS
  - no .blend1 remains

stop_conditions:
  - the character reference file is modified in any way (report BLOCKER = CHARACTER_FILE_MODIFIED)
  - violet appears anywhere in the environment's materials or lighting (report BLOCKER = VIOLET_IN_ENVIRONMENT)
  - the set cannot function as a standalone file without the character file (report BLOCKER = SET_NOT_STANDALONE)
  - validator or verification command cannot run (report BLOCKER = VALIDATOR_SCHEMA_MISMATCH)
  - .blend1 backup remains after cleanup

verify_command: python .mikage\tools\verify_output.py
next_step_if_pass: Lane B reviews the proof; if approved, Lane B drafts the Exit 1 cinematic proof shot task (slit dormant-to-ignite animation, slow camera push-in, subtle head tilt/weight shift, cut to black) using this environment set.
next_step_if_fail: stop and report BLOCKER reason only. Do not open a new scope.
