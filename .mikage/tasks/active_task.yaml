  - give the porcelain helmet subtle subsurface scattering plus non-uniform roughness plus a thin clearcoat, and give the cloak a faint sheen/fresnel so the rim catches its edge
  - set the camera to roughly 85mm with shallow depth of field (f/1.4-2.8) focused on the slits, a slight low angle, and upper-third head placement
  - grade with AgX or Filmic (report which), crush blacks toward #050508, lift only the violet band's saturation/luminance, add selective bloom on the slits, very light chromatic aberration on violet edges, fine grain, light vignette
  - render a contact sheet with BEFORE (unmodified turntable render) and AFTER (cinematic) pairs at the same angle(s)
  - sample halo pixel color at 4 or more points per frame across the contact sheet and report the numeric RGB/hex values
  - write full findings into the proof and gate report
  - write the real deliverables into the paths listed under real_deliverables
  - run deterministic verification appropriate to this task type
  - clean .blend1 backups
  - commit local changes only

