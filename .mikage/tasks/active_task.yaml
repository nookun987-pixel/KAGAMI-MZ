allowed_actions:
  - create V1.4 gait-proof derivative blend from V1.3A binding-fixed base
  - animate one 96-frame 24fps slow heavy mechanical four-leg walk (crawl gait, >=3 feet grounded per step)
  - keep at least three feet grounded during each individual leg step
  - keep each planted foot fixed in world space until its own lift phase
  - lift, clear, advance and forward-plant each of the four feet in the order FL, RR, FR, RL
  - progress the chassis forward via weight transfer without bouncing
  - keep rider, seat and docked Zenith Blade attached with no drift
  - keep all visible panels following their assigned rigid assemblies
  - add new controls ONLY if strictly required for stable foot planting, and document each addition
  - render one V1.4 gait contact sheet (3600x1800, six labelled-by-phase panels)
  - render one V1.4 gait proof mp4 (1920x1080, 24fps, 96 frames, H.264, yuv420p, no audio, no on-screen text)
  - write the V1.4 gait report with the required final-report fields
  - run deterministic verification (Blender reopen, frame evaluation, mesh fingerprint, world-transform sampling, ffprobe, png dimension)
  - clean .blend1 backups
  - commit local changes only

forbidden_actions:
  - do not remodel or edit any visible geometry mesh
  - do not change V1.3A binding categories or control assignments
  - do not change rider proportions, helmet, or the exactly two violet slits
  - do not change Zenith Blade docked binding
  - do not change main chassis or lower-structure design, palette, or violet placement
  - do not move the ground, background, or world-space reference markers
  - do not add combat, weapon draw, enemy, VFX, or camera motion
  - do not create a gallop or fast run
  - do not hide foot slide by changing camera framing
  - do not add new violet objects or materials
  - do not add controls for anything other than stable foot planting
  - do not claim canon lock, asset lock, final pass, production ready, public ready, or mount locked
  - do not push
  - do not modify unrelated files
  - do not leave any .blend1 backup

pass_conditions:
  - all four feet complete their required step (FL, RR, FR, RL)
  - planted-foot world slide is effectively zero during each support phase
  - every moving foot clears the ground and replants forward of its previous world position
  - chassis advances measurably relative to static world references
  - rider, seat and docked weapon remain attached with no drift
  - no major armor intersection
  - no geometry edits were required
  - frame 96 ends in a mechanically stable pose
  - original visible mesh fingerprints unchanged
  - environment objects bound to mount = 0
  - world-static reference transforms unchanged
  - V1.4 blend reopens and plays back frames 1-96 after reopen
  - contact sheet is exactly 3600x1800 with the six required phase panels
  - mp4 is 1920x1080, 24fps, 96 frames, H.264, yuv420p, no audio
  - no .blend1 backup remains for V1.4
  - output remains CANDIDATE only

stop_conditions:
  - any support foot must slide for the sequence to work
  - world-static references must move
  - a leg cannot complete its step within existing rotation limits
  - rider, weapon, or visible panels drift
  - geometry changes are required
  - validator or verification command cannot run
  - .blend1 backup remains after cleanup

verify_command: python .mikage\tools\verify_output.py
next_step_if_pass: Lane B drift-check + operator review of four-step gait evidence (contact sheet + mp4 + report); then BOOS decides PASS/HOLD and whether to authorize push.
