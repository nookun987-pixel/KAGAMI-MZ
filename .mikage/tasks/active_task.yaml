real_deliverables:
  - production/character/production_actor/rig_derivatives/MIKAGE_PRODUCTION_RIG_BIND_V0_1.blend
  - production/character/reviews/MIKAGE_PRODUCTION_RIG_BIND_V0_1_CONTACT_SHEET.png
  - production/character/reviews/MIKAGE_PRODUCTION_RIG_BIND_V0_1_PROOF.md

allowed_actions:
  - open MIKAGE_PRODUCTION_RIG_LOOKDEV_INTEGRATION_V0_1.blend and survey every visible, render-enabled mesh object not already listed as legacy in the armature audit; report each mesh's name, general shape, and which body region it corresponds to
  - based on that survey, classify each visible mesh as needing soft deformation (flexible body/cloak mesh that must bend at joints) or rigid attachment (hard accessories - helmet, blade, halo)
  - bind soft-deformation meshes to the existing MIKAGE_initial_armature_scaffold using Armature modifier + vertex groups, with blended weights across adjacent bones at the joint regions actually present in the mesh (e.g. waist/hip area spanning pelvis-spine_01-spine_02-chest if the cloak is one continuous volume)
  - bind rigid-accessory meshes (helmet, blade, halo) using either a Child-Of constraint or an Armature modifier with a single weight=1.0 group to the appropriate bone (head for helmet/halo; hand.R or root/pelvis for the blade depending on what the actual geometry shows - report the choice and reasoning)
  - use only the 23 existing bones - no new bones, no bone repositioning
  - run one light test pose (approx 10-15 degrees on a relevant bone, e.g. chest) to confirm the new bindings deform without obvious tearing/clipping - this is a binding sanity check, NOT the full 8-pose Stage B test
  - render a simple contact sheet showing at least one neutral-pose view and one light-test-pose view to demonstrate the binding works
  - write the survey results, binding choices, and test results into contact_sheet_review_report.md and the full proof
  - write the real deliverables (new derivative blend, contact sheet, proof) into the paths listed under real_deliverables
  - run deterministic verification (geometry/material hashes unchanged except for the added binding data, halo color check, bone count/position unchanged)
  - clean .blend1 backups
  - commit local changes only

forbidden_actions:
  - do not add, remove, or reposition any bone in the armature
  - do not change the geometry, silhouette, or proportions of any mesh
  - do not change any material or color, including the halo (must remain white) or the two slit emission materials
  - do not create any new mesh
  - do not perform the full 8-pose Stage B deformation test in this task - only a single light test pose to confirm binding sanity
  - do not do any final/marketing render - test-purpose render only
  - do not modify or reference the 29 hidden legacy meshes from the armature audit - leave them untouched
  - do not claim canon lock, asset lock, or production-rig-ready (label CANDIDATE / NOT CANON-LOCKED)
  - do not push
  - do not modify unrelated files
  - do not leave any .blend1 backup
  - do not place any file other than contact_sheet.png and contact_sheet_review_report.md in the gate folder

pass_conditions:
  - every visible mesh is surveyed and classified (soft-deform vs rigid-attach) with reasoning reported
  - soft-deformation meshes have blended vertex-group weights across more than one bone at the actual joint regions present
  - rigid-accessory meshes (helmet/blade/halo) are attached via constraint or single-group rigid binding, moving correctly with their parent bone
  - only the 23 existing bones are used - bone count and positions unchanged
  - geometry, silhouette, and all materials (including halo white and slit violet) are unchanged except for the added binding data
  - the light test pose (10-15 degrees) shows no severe tearing/clipping
  - gate folder holds ONLY contact_sheet.png + contact_sheet_review_report.md and python .mikage/tools/verify_output.py prints PASS
  - no .blend1 remains

stop_conditions:
  - geometry or material changes beyond binding are required to make this work (report BLOCKER = BIND_SIDE_EFFECT_DRIFT)
  - the light test pose still shows severe tearing/clipping that cannot be resolved within binding-only scope (report BLOCKER = BIND_INSUFFICIENT, do not expand into mesh/geometry edits)
  - the halo changes color (report BLOCKER = HALO_COLOR_VIOLATION)
  - validator or verification command cannot run (report BLOCKER = VALIDATOR_SCHEMA_MISMATCH)
  - .blend1 backup remains after cleanup

verify_command: python .mikage\tools\verify_output.py
next_step_if_pass: Lane B reviews the binding survey/proof; if approved, Lane B drafts the actual Stage B task (full 8-pose deformation contact sheet) on this newly bound file.
next_step_if_fail: stop and report BLOCKER reason only. Do not open a new scope.
